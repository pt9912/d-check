# Doku-Referenz-Gate (Adopter-Baseline). Startgerüst: `d-check --print-config`.
# Ins Repo-Root kopieren. Wächst mit den Artefakten: ids/codepaths erst
# aktivieren, wenn Targets/roots existieren — sonst Config-Fehler bzw. ein
# behaupteter, aber leerer Gate (Modul 13).
# AKTIVIEREN HEISST ZWEI SCHRITTE: den Block entkommentieren UND den Modulnamen
# in `modules` unten aufnehmen. Nur der erste Schritt laesst das Modul stumm —
# die Konfiguration ist dann gueltig und wirkungslos, also genau die
# Gate-Luege, gegen die Modul 13 antritt. Gegenprobe nach dem Aktivieren:
# einen Verstoss der Klasse einbauen und den Befund sehen.
scan:
  roots: ["."]
  ignore: ["**/*.template.md", ".tmp/**"]
modules: [links, anchors]
# Linkpflicht fuer ADR-Kennungen: `matrix` beurteilt den Status eines Ziels nur an
# Links (Kurs `referenz-richtung.md`: Slice -> ADR mit Status Superseded faellt); eine
# nackte Kennung ist fuer diese Pruefung unsichtbar. `ids` erzwingt den Link, `link-policy:
# always` auch fuer die Kennung in Inline-Code — ohne sie bleibt sie dort unbeanstandet.
# Die `adr`-Klasse in `matrix` traegt deshalb kein `token`: steht sie ohne diesen `ids`-Block,
# bleibt die nackte Kennung ungeprueft — beide Bloecke zusammen aktivieren.
# ids:
#   patterns:
#     - {regex: 'ADR-([A-Z]+-)?\d{4}', target: docs/plan/adr/, link-policy: always}  # aktivieren, sobald docs/plan/adr/ existiert; Segment optional (ADR-IDX-0004); always: auch die Kennung in Inline-Code ist linkpflichtig
#     - {regex: '<PREFIX>-[A-Z]{2}-\d{2}', target: spec/lastenheft.md}  # Präfix setzen; aktivieren, sobald spec/lastenheft.md existiert
# codepaths:
#   roots: [spec, docs, harness]                                        # aktivieren, sobald diese Verzeichnisse existieren
#
# Deklarations-Konsistenz Gate-Index <-> Makefile — aktivieren, sobald das
# erste Gate-Target im Makefile steht. Die MASCHINELLE HAELFTE der Hard Rule
# aus `modul-13-quality-gates.md` §Hard Rule: Ohne sie lebt "kein behauptetes
# Gate ohne Deckung" nur im Briefing, und eine Regel in nur einem Quadranten
# ist halb durchgesetzt (`modul-09-implementierung.md` §Hard Rules). Zwei
# Richtungen: jedes im Index behauptete `make X` ist eine reale Regel
# (gate-phantom), und jede Regel steht im Index (gate-undocumented).
# targets:                                                              # + `targets` in `modules` aufnehmen
#   makefiles: [Makefile]                                               # d-check.mk erst ergaenzen, wenn `d-check --print-mk` gelaufen ist
#   doc-tables: [harness/README.md]                                     # der EINE Gate-Index (`grundlagen-harness-dateien.md`)
#   authority: harness/README.md                                        # dieselbe Datei — es gibt nur einen Index
#   # Erzeugt ein Werkzeug Make-Fragmente unter harness/mk/, fuehrt es deren
#   # Targets in harness/mk/<werkzeug>.md (`grundlagen-harness-dateien.md`
#   # §harness/README.md als Einstiegspunkt). Dann misst der Sensor gegen die
#   # Vereinigung aller Teile (d-check >= v0.82.0). Die Disjunktheit (kein
#   # Target in zwei Teilen) prueft er nur mit dem Schalter (d-check >= v0.83.0,
#   # gate-declared-twice) — ohne ihn bleibt eine Doppelnennung still:
#   # makefiles: [Makefile, "harness/mk/*.mk"]
#   # doc-tables: [harness/README.md, harness/mk/<werkzeug>.md]
#   # authority: [harness/README.md, harness/mk/<werkzeug>.md]
#   # authority-disjoint: true                                          # d-check >= v0.83.0; nur mit authority als Liste
#   # Utility ohne Gate-Anspruch (§Vorhanden != behauptet). NAMENTLICH, nie
#   # als Glob: Kommt bei einer Regeneration ein Target dazu, soll der Sensor
#   # es melden, statt es still durchzulassen.
#   exempt-targets: [help, build, run, clean,
#                    doc-check, doc-trace, doc-complete, doc-doctor, doc-repair,
#                    doc-immutable, doc-commits, doc-planning, doc-tracked,
#                    doc-targets, doc-structure, doc-usage, doc-help]
#
# Referenz-Richtung (SDP) mechanisch — aktivieren, sobald spec/ und docs/plan/
# existieren. Bildet die Referenzmatrix des Regelwerks ab
# (`grundlagen-referenz-richtung.md` §Referenz-Richtung (SDP)); ohne sie lebt die
# Regel nur im Briefing, nicht im Gate.
# matrix:
#   classes:
#     - name: spec
#       paths: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]
#       order: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]  # Vertrag > Technik > Sicht
#       direction: no-downward                                          # Abwaertslink innerhalb der Spec -> matrix-downward
#     - name: adr
#       paths: ["docs/plan/adr/[0-9]*.md", "docs/plan/adr/[A-Z]*-[0-9]*.md"]  # ohne und mit Bereichssegment; README.md traegt keins und bleibt draussen
#                                                                       # kein `token`: das ids-Muster oben faengt die blosse Kennung im Fliesstext (id-unlinked) — `ids` dann MIT aktivieren
#     - name: slice
#       paths: ["docs/plan/planning/**/slice-*.md"]
#       token: 'slice-[a-z0-9]+(-[a-z0-9]+)*'                           # die Kennung ist ein Slug, keine laufende Nummer
#     - name: welle
#       paths: ["docs/plan/planning/**/welle-*.md"]
#       token: 'welle-[a-z0-9]+(-[a-z0-9]+)*'
#     - name: carveout
#       paths: ["docs/plan/carveouts/CO-*.md"]
#       token: 'CO-\d{3}'
#     - name: roadmap                                                   # ohne Token: nur ueber Links erreichbar
#       paths: ["docs/plan/planning/**/roadmap.md"]
#   rules:
#     - {from: spec, to: adr, allow: false}                             # Decken-Regel: kein Spec-Stratum nennt eine ADR …
#     - {from: spec, to: slice, allow: false}                           # … und keinen Slice
#     - {from: spec, to: welle, allow: false}                           # … keine Welle
#     - {from: spec, to: carveout, allow: false}                        # … keinen Carveout
#     - {from: spec, to: roadmap, allow: false}                         # … und keine Roadmap
#     - {from: adr, to: slice, allow: false}                            # Ausnahme je Zeile: <!-- d-check:status-provenance -->
#     - {from: adr, to: welle, allow: false}                            # dieselbe Ausnahme
#     - {from: adr, to: carveout, allow: false}
#     - {from: adr, to: roadmap, allow: false}
#   status: {forbidden: [superseded, deprecated]}                       # nur aktive ADRs referenzieren
# Ohne `exclude-sections`. Welche Abschnitte ausgenommen werden — und ob
# ueberhaupt —, regelt das Baseline-Regelwerk `grundlagen-referenz-richtung.md`
# §Referenz-Richtung (SDP); diese Datei bildet die dortige Setzung nur ab.
#
# Baseline-Pin gegen Tag-Drift — aktivieren, sobald harness/conventions.md
# einen Baseline-Stand deklariert. Jeder Verweis in die vendorte Baseline
# traegt deren Version im Pfad (`.harness/baseline/<tag>/…`); nach einem
# Baseline-Bump zeigen die nicht nachgezogenen ins Leere. `versions` liest den
# adoptierten Stand aus EINER Deklaration und meldet jeden abweichenden Pin
# als `version-stale` — der vergessene Nachzug wird ein Befund statt eines
# toten Links. Der Anker zeigt auf die Zeile, die den Stand nennt, nie auf
# eine feste Nummer.
# versions:
#   pin-pattern: '\.harness/baseline/(v\d+\.\d+\.\d+)/'
#   current-from: harness/conventions.md#baseline
#   exempt-paths: ["harness/conventions/done/**"]   # aufgeloeste Eintraege sind eingefroren

# Append-only der Adaptions-Eintraege — aktivieren, sobald harness/conventions/
# existiert. Braucht git und eine Commit-Range (Target `doc-immutable` aus
# `d-check --print-mk`); prueft, dass der Core einer MR-Datei ueber die Range
# unveraendert bleibt. Welche Eintraege unveraenderlich sind und ab wann,
# regelt das Baseline-Regelwerk `grundlagen-harness-dateien.md`
# §harness/conventions.md als Konventionsspeicher: **Eintraege werden nie
# ueberschrieben** — ab dem ersten Commit, nicht ab einem Status.
#
# Deshalb keilt `immutable-when` auf die Datums-Zeile, die jeder Eintrag
# traegt, und nicht auf ein Status-Feld: Ein MR-Eintrag hat keines, sein
# Zustand ist die Verzeichnis-Position (`conventions/` aktiv, `done/`
# aufgeloest). Aus demselben Grund fehlen `status-line` und `head-allow` —
# es gibt keinen erlaubten Uebergang IN der Datei.
# vcs:
#   paths: ["harness/conventions/**/MR-[0-9]*.md"]
#   immutable-when: '^- \*\*Datum:\*\*'

# Review-Report-Deckung fuer `done/`-Slices mit Review-DoD-Punkt (Kurs
# `modul-05-planning-harness.md` §Ziel-Form: Slice, Review-Zeile seit Welle
# 119) — aktivieren, sobald der erste Slice nach `done/` wandert. `done-dir`
# ist der Aktivierungs-Schalter: ohne ihn oeffnet das Modul keine Datei.
# reviews:
#   done-dir: docs/plan/planning/done
#   reviews-dir: docs/reviews
#   match: name               # Slice-Kennungen sind Slugs (`slice-<titel>`), keine slice-<NNN> (d-check >= v0.85.0)
#   require-promises: true    # null erkannte Zusagen unter vorhandenen Slices => Befund (Leerlauf laut)
#   recursive: true           # Stubs unter done/<welle-id>/ werden gesehen ...
#   skip-pattern: '(?m)^> \*\*ARCHIVIERT\*\* — Volltext:'   # ... und ausgenommen, flache Stubs ebenso
#   skip-allows-empty: true   # alles archiviert = Ruhezustand, kein Befund (d-check >= v0.86.0)
#   # Die Zusage-Form der Slice-Vorlage ("Review durchgefuehrt") erkennt der
#   # Default ab d-check v0.85.0; davor lief das Gate ueber einer leeren Menge
#   # gruen. Ein ungehakter Review-Punkt (`- [ ]`) ist ebenfalls eine Zusage.
#   # Archivierte Slices (Stub mit `> **ARCHIVIERT**`) prueft das Modul nicht
#   # mehr — Volltext und Report liegen im Archiv, geprueft wird vor dem
#   # Archivieren. Ohne die drei Schluessel darueber wird es nach dem
#   # Archivieren rot, obwohl nichts fehlt. Grenze: skip-pattern erkennt den
#   # Stub an seiner Marker-Zeile — ein lebender Slice, der die Stub-Form
#   # woertlich zitiert, gilt dann auch als Stub; ein solches Zitat eingerueckt
#   # setzen.

# Guide-Datei-Wildwuchs (Kurs `grundlagen-klassifikation.md` §Entropy
# Management) — aktivieren, sobald AGENTS.md eine erste, gemessene
# Ist-Zeilenzahl hat: den Startwert auf diese Zahl plus Marge setzen, keinen
# erfundenen Zielwert eintragen. Sinken ist immer erlaubt, steigen nur mit
# sichtbarem Commit an dieser Zeile (Ratchet, kein Rueckbau-Zwang). `file`
# prueft die ganze Datei, unabhaengig von scan.roots/scan.ignore — kein
# `<modul>.scope` noetig.
# file:
#   - files: AGENTS.md
#     max-lines: <Ist-Zeilenzahl + Marge>
