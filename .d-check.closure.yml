# .d-check.closure.yml — das Prüf-Profil des **Closure-Bindepunkts**
# (DC-FA-CLI-012, ADR-0048). Gefahren von `make verify-closure-notes`, NICHT
# von `make gates`.
#
# Warum eine zweite Datei statt eines Blocks in .d-check.yml: die
# Closure-Note-Struktur wohnt im Modul `planning` — stünde sie in der
# konventionellen Config, liefe sie überall mit, wo `--enable planning` läuft,
# also im inneren Loop (`make planning-check` ist Teil von `gates`). Eine
# Closure-Frage gehört aber an die Closure, nicht in den Inner-Loop; die
# Trennung ist ohne eine zweite Herkunft nicht machbar (ADR-0048 Entscheidung 7,
# dieselbe Bindepunkt-Trennung wie bei `completeness-check`/ADR-0026).
#
# `modules: []` = leere Menge; das Profil aktiviert ausschließlich, was die
# Kommandozeile per `--enable` dazuschaltet. Kein Netz-Modul
# (`external`/`sources`) — die zweite Config ist keine zweite Netz-Tür
# (DC-QA-03; ein Go-Test verriegelt genau das).
#
# WELCHE Module dazugeschaltet werden, steht hier BEWUSST NICHT (ADR-0077):
# es stuende sonst an zwei Orten, und der zweite kann nur falsch werden. Genau
# das ist hier passiert — die Vorgaengerfassung zaehlte die Module auf und war
# zwei Wochen lang falsch, ohne dass ein Lauf es meldete. Der eine Ort ist das
# Makefile-Rezept.
#
# GRENZE, benannt statt zugesagt: KEIN Sensor haelt das Rezept gegen die
# Deklarations-Flaechen. `targets` vergleicht Target-NAMEN, keine
# Beschreibungstexte (gemessen).
modules: []

planning:
  # Offene-Wellen-Form wie im Hauptprofil (slice-108) — beide Profile
  # lesen dieselbe Sektion, eine abweichende Antwort waere die
  # bekannte Zwei-Antworten-Klasse.
  heading: "## Offene Wellen"
  marker: "Nichts in Arbeit"
  # Die Roadmap-Datei ist auch hier Pflicht: sie trägt den Aktiv-Status und ihr
  # Verzeichnis ist das Slice-Verzeichnis. Der Closure-Lauf prüft damit
  # zusätzlich die Lifecycle-Invariante — dieselbe Aussage wie in `gates`,
  # doppelt gefahren schadet nicht (hermetisch, deterministisch).
  roadmap: docs/plan/planning/in-progress/roadmap.md
  closure:
    # Der Ruheort der abgeschlossenen Slices. Nur hier wird Slice-INHALT
    # gelesen; in-progress-Slices tragen noch keine Closure-Pflicht.
    dir: docs/plan/planning/done
    # `closure.glob` bleibt UNGESETZT — die Fähigkeit erbt `slice-glob` und
    # prüft nur `slice-*.md`. Das war eine Entscheidung gegen den ersten
    # Anlauf: dort stand hier `glob: "*.md"` samt `heading-pattern` auf
    # `^#{1,3}`, um die 11 `welle-*-results.md` und die 4 Wellen-Plan-Dokumente
    # mitzuprüfen. Ein Review hat gemessen, dass das ein FALSCH-NEGATIV baut:
    # bei den Ergebnisnotizen ist die passende Überschrift der Dokument-TITEL,
    # der gemessene Abschnitt also die ganze Datei — ein Dokument mit drei
    # unausgefüllten `_Ausstehend._`-Abschnitten bleibt grün, derselbe
    # Platzhalter unter H2 meldet `closure-note-thin`. Zugleich liefe die
    # Floskel-Prüfung über beliebigen Dateitext.
    #
    # Die Wurzel ist eine Artefakt-Verwechslung: eine Wellen-Ergebnisnotiz
    # ENTHÄLT keine Closure-Notiz, sie IST eine. Sie zu prüfen heißt, ihre
    # Abschnitts-Struktur zu prüfen — das ist die Zusage des Moduls `structure`
    # (slice-099), nicht die dieser Fähigkeit.
    #
    # `min-sentences` und `heading-pattern` bleiben auf den Kern-Defaults
    # (`^#{2,3} .*Closure-Notiz` und 4). Gemessen am eigenen Bestand: 95/95
    # Slices tragen einen Abschnitt. Nach der Zaehl-Angleichung (slice-094) liegt
    # das Minimum bei 5 Satzende-Zeichen (mit dem Produkt gemessen: bei 6 wird
    # der erste Slice rot) — vorher waren es 7. Der Abstand zur Schwelle 4 ist
    # damit 1 statt 3; das ist die gewollte Wirkung, die Schwelle bleibt ein
    # Boden, keine Decke.
    #
    # Vierte Bedingung, opt-in (ADR-0052): der unausgefuellte Rumpf einer
    # Vorlage. Er passiert die drei anderen, weil er syntaktisch vollstaendig
    # ist. Vor dem Scharfschalten am eigenen Bestand gemessen — 96
    # Closure-Notizen, **null** Treffer: die Erkennung ignoriert Inline-Code,
    # und genau dort steht d-checks gezeigte Meta-Syntax (`<PREFIX>`, `<a id>`,
    # `<datei>`). Ohne diese Einschraenkung waeren es zwoelf Falsch-Positive.
    placeholder: true
    #
    # Die Floskel-Liste ist im Produkt bewusst LEER (sie entscheidet über
    # rot/grün und wäre sprach-gebunden falsch, ADR-0048 Entscheidung 5); hier
    # steht d-checks eigenes Vokabular. Aufgenommen wird nur, was im Bestand
    # NULL Treffer hat — „Fertig." (6 Treffer) und „läuft jetzt" (3) sind
    # bewusst NICHT dabei: als Teilstring erzeugten sie Falschbefunde in
    # Notizen, die sehr wohl Substanz tragen.
    # Seit dem Wortgrenzen-Vergleich sind KURZE Phrasen brauchbar. Vor der
    # Aufnahme gemessen, wie immer — je Kandidat ein Lauf gegen den eigenen
    # Bestand: fertig 0, n/a 0 (aufgenommen); ok 1, erledigt 1, „laeuft“ 11
    # (nicht aufgenommen, die Treffer sind echte Prosa). Wortgrenzen machen
    # kurze Phrasen brauchbar, nicht automatisch sicher.
    boilerplate:
      - "fertig"
      - "n/a"
      - "wie geplant umgesetzt"
      - "war ganz okay"
      - "erfolgreich abgeschlossen"
      - "nichts Besonderes"
      - "alles gut"

# Modul structure (DC-FA-STRUCT-001, ADR-0049): Struktur-Invarianten INNERHALB
# der Dokumente, die den Lifecycle verlassen haben. Sie gehoeren an denselben
# Bindepunkt wie die Closure-Notiz-Struktur — eine Frage an den Ruheort, nicht
# an den inneren Loop.
#
# Jede Regel ist VOR der Aufnahme am eigenen Bestand gemessen worden; nur was
# null Befunde hatte, steht hier. Ausdruecklich NICHT aufgenommen:
#
#   DoD ohne offene Tasks              32 Befunde — und die sind BERECHTIGT:
#                                      ein abgeschlossener Slice darf eine
#                                      offene Box tragen, wenn die WELLE sie
#                                      einloest (slice-094 tut das). Die Regel
#                                      waere am ersten Tag falsch gewesen.
#   ADR: Fitness Function              15   aeltere ADRs kennen den Abschnitt
#   ADR: Re-Evaluierungs-Trigger       20   noch nicht — Sanierung waere ein
#   ADR: Verglichene Alternativen      14   eigener Slice, keine Nebenwirkung
#   Wellen-Results: Steering-Loop       7   dieses hier
structure:
  # Jeder abgeschlossene Slice traegt eine nicht-leere Closure-Notiz. Das
  # DOPPELT die Aussage des planning-Gates bewusst nicht: dort geht es um
  # Substanz (Satzzahl, Floskel, Platzhalter), hier nur um die Existenz des
  # Abschnitts ueber denselben geteilten Mechanismus — der Preset-Beleg im
  # eigenen Lauf.
  - files: "docs/plan/planning/done/slice-*.md"
    section-pattern: '^#{2,3} .*Closure-Notiz'
    non-empty: true

  # Jeder abgeschlossene Slice traegt eine Definition of Done.
  - files: "docs/plan/planning/done/slice-*.md"
    section-pattern: '^## [0-9]+\. Definition of Done'
    non-empty: true

  # Kein abgeschlossener Slice traegt einen unaufgeloesten Vorlagen-Platzhalter
  # -- die urteilsfreie Haelfte der Drei-Ausgaenge-Regel des Regelwerks
  # (modul-05 §Offene Risiken werden bei Closure aufgeloest). Geprueft wird
  # JEDER H1-Abschnitt (sections: each), nicht nur der Titel-Abschnitt: ein
  # Selektor auf die Titelzeile kappte bei einer zweiten H1 die Spanne still,
  # und die Nullmengen-Haerte deckt nur den Fall KEIN Treffer.
  #
  # Geprueft wird der bereinigte Abschnitts-Text. VIER BEREICHE SIEHT DIE REGEL
  # DAMIT NICHT, und drei davon sind gewollt: die Ueberschriften-Zeile selbst,
  # Fenced Blocks und Inline-Code-Spannen -- ohne diese Trennung meldete ein
  # Slice, der ueber die Platzhalter SCHREIBT, seine eigene Dokumentation.
  #
  # Der vierte ist der Preis: Inline-Code wird ABSATZWEISE gepaart, also auch
  # ueber Zeilengrenzen hinweg. Ein Platzhalter zwischen zwei Backticks
  # desselben Absatzes ist unsichtbar -- gemessen. Das abgeloeste Skript paarte
  # je Zeile und meldete ihn; seine engere Paarung war aber die falschere
  # Markdown-Lesart. Abgewogen und entschieden in ADR-0059.
  #
  # Grenze, benannt: die Alternation ist eine LISTE. Aendert die Vorlage ihre
  # Platzhalter-Form, schweigt die Regel; sie gehoert beim naechsten
  # Vorlagen-Bump mitgeprueft.
  - files: "docs/plan/planning/done/slice-*.md"
    section-pattern: '^# '
    sections: each
    forbid-pattern: '\(bei Closure\)|wird mit dem Closure-Body gefüllt|<…>|<eingetreten:'

  # Die zweite Haelfte der urteilsfreien Drei-Ausgaenge-Pruefung: der Ausgang
  # eines Risikos traegt eines der drei kanonischen Woerter, nicht Freitext.
  # Die Platzhalter-Regel darueber faengt den VERGESSENEN Ausgang; diese faengt
  # den ERFUNDENEN (MR-049).
  #
  # Das Muster ist das KOMPLEMENT der drei erlaubten Woerter bis Tiefe fuenf,
  # als forbid-pattern: es feuert JE VORKOMMEN des Markers, nicht einmal je
  # Abschnitt. Ein §5 mit einem kanonischen und einem Freitext-Ausgang wird
  # damit gemeldet. Der Trennteil [\s*_]* deckt Zeilenumbruch, Fettung und
  # Kursivierung zwischen Marker und Wort -- ohne ihn meldete die Regel die
  # 80-Spalten-Umbrueche dieses Repos als Verstoss.
  #
  # WAS SIE NICHT SIEHT, gemessen:
  #   - ein Risiko GANZ OHNE Marker (kein Vorkommen, kein Match). Im Bestand
  #     drei Dateien: slice-106, slice-110, slice-111.
  #   - ein Ausgangswort in Inline-Code -- die Bereinigung leert die Spanne,
  #     der Marker steht dann vor Freitext und die Regel meldet FALSCH.
  #   - Abweichungen ab dem sechsten Zeichen (`eingetreXen` laeuft durch).
  #
  # Die Ausnahme nennt den ABGESCHLOSSENEN Altbestand mit fester Ziffernzahl.
  # `slice-1[0-3]*` waere die naheliegende Form und naehme auch slice-1000 bis
  # slice-1399 heraus -- dieselbe lautlose Klasse, die ein Glob auf die neuen
  # Nummern erzeugt haette. Gemessen am Bestand: ohne Ausnahme 122 Befunde
  # (107 `section-missing`, weil die aelteren Slices ihr §5 unter anderem Titel
  # fuehren, plus 15 Freitext-Ausgaenge), mit ihr null.
  - files: "docs/plan/planning/done/slice-*.md"
    exempt-paths:
      - "docs/plan/planning/done/slice-0??-*"
      - "docs/plan/planning/done/slice-1[0-3]?-*"
    section: "## 5. Abnahme-Punkte / Risiken"
    forbid-pattern: '\*\*Ausgang:[\s*_]*(?:[^ew\s*_]|e[^in]|ei[^n]|ein[^g]|eing[^e]|en[^t]|ent[^f]|entf[^a]|w[^e]|we[^i]|wei[^t]|weit[^e]|weite[^r])'

  # Jede Wellen-Ergebnisnotiz beantwortet die erste Pflichtfrage.
  - files: "docs/plan/planning/done/welle-*-results.md"
    section-pattern: '^## Was wurde geliefert'
    non-empty: true
