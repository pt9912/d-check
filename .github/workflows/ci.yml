name: ci

# PR-/Push-CI (slice-039, ADR-0013; DC-FA-DIST-001, DC-QA-02).
#
# Zieht denselben Vertrag wie der Release-Workflow auf jede Integration
# (pre-integration statt nur Release): `make ci` (gates + image-test) mit
# der digest-gepinnten Engine (ADR-0011) -> lokal = PR = Release; schliesst
# die Stop-Hook-Restlücke "frischer Klon ohne Gate-State" ueber CI als Netz.
# Zusaetzlich das Traceability-Gate (`make trace-check`) ueber den
# Commit-Range: jede Commit-Message muss eine DC-/ADR-/slice-ID nennen.
#
# Tag-Pushes (`v*`) laufen ausschliesslich in release.yml -> hier per
# tags-ignore ausgenommen, keine Doppellaeufe.
#
# Action-Pinning (AGENTS.md §3.9, Supply-Chain-Haertung, u-boot-Konvention):
# `uses:` SHA-gepinnt mit Tag-Kommentar (gleicher Pin wie release.yml).

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

# Top-level: alles entziehen; der Job lockert nur, was er braucht.
permissions: {}

jobs:
  ci:
    name: gates + image-test + traceability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volle Historie fuer den Commit-Range des Traceability-Gates.
          fetch-depth: 0

      # Commit-Range-Gates: Traceability (DC-/ADR-/slice-ID) ist billig (bash) und
      # laeuft fail-fast zuerst. ADR-Immutable laeuft seit ADR-0024 ueber das Modul
      # vcs (Image) statt eines Skripts und baut dafuer das Runtime-Image — das
      # `make ci` darunter per Docker-Cache wiederverwendet (kein Doppel-Build).
      #
      # Slice-Closure-Uebergang (welle-86/slice-175): dieselbe Bindung wie im
      # lokalen pre-commit-Hook (.githooks/pre-commit), hier ueber die
      # Commit-Range statt --staged -- --no-verify umgeht den Hook, nicht die
      # CI. Ein Rename/Add nach docs/plan/planning/done/slice-*.md IRGENDWO in
      # der Range loest make verify-closure-notes gegen den HEAD-Stand aus.
      - name: Traceability + ADR-Immutable + Slice-Closure-Uebergang (Commit-Range)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then
            RANGE="$PR_BASE..$HEAD_SHA"
          elif [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            # Neuer Branch (kein before-Commit): gegen den Default-Branch
            # pruefen statt nur HEAD (sonst Silent-Green).
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" 2>/dev/null || true
            RANGE="origin/$DEFAULT_BRANCH..$HEAD_SHA"
          else
            RANGE="$PUSH_BEFORE..$HEAD_SHA"
          fi
          echo "Pruefe Commit-Range: $RANGE"
          make trace-check RANGE="$RANGE"
          make adr-check RANGE="$RANGE"
          if git diff --name-status --diff-filter=AR "$RANGE" -- 'docs/plan/planning/done/' \
              | awk '{print $NF}' | grep -qE '^docs/plan/planning/done/slice-[0-9]+[^/]*\.md$'; then
            echo "Slice-Closure-Uebergang im Commit-Range erkannt -- verify-closure-notes"
            make verify-closure-notes
          fi

      # Volle Gates + Image-Integrationstests (identische Engine wie Release).
      - name: Gates + Image-Integrationstests (make ci)
        run: make ci
