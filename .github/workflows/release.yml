name: release

# GHCR-Release-Pipeline (slice-011, DC-FA-DIST-001, ADR-0002, ADR-0014;
# Vorbild: u-boot publish.yml — gleiche Build-Familie).
#
# Trigger: Push von Tags `v*`. Der Validate-Step verwirft alles, was
# nicht `vMAJOR.MINOR.PATCH(-prerelease)?` ist, BEVOR eingeloggt,
# gebaut oder gepusht wird. `:latest` wird ausschließlich für stabile
# Tags gesetzt — ADR-0014 ratifiziert das und löst ADR-0002 §4 insoweit
# ab; Konsumenten werden auf Digest-Pins verwiesen
# (docs/user/releasing.md).
#
# Docker-only-Pfad (AGENTS.md §3.1): `make ci` fährt die kompletten
# Gates inkl. Image-Integrationstests und baut dabei das lokale
# Runtime-Image (`d-check:latest`), das anschließend für GHCR
# umgetaggt und gepusht wird.
#
# Action-Pinning (AGENTS.md §3.9, Supply-Chain-Härtung, u-boot-Konvention):
# alle `uses:`-Einträge sind SHA-gepinnt mit Tag-Kommentar.

on:
  push:
    tags:
      - 'v*'

# Top-level: alles entziehen; der Job lockert nur, was er braucht.
permissions: {}

jobs:
  release:
    name: release (ghcr.io image push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write    # GitHub-Release mit Digest-Pin anlegen
      packages: write
    env:
      DOCKER_BUILDKIT: '1'
      REGISTRY: ghcr.io
      IMAGE_NAME: pt9912/d-check
      # LOCAL_IMAGE muss zum Makefile-Default `IMAGE ?= d-check`
      # passen — `make ci` taggt `$(IMAGE):latest` lokal.
      LOCAL_IMAGE: d-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SemVer-Validate ZUERST (fail-fast vor Login/Build/Push):
      # strikte SemVer-2.0-Prüfung, Build-Metadaten (`+`) abgelehnt
      # ('+' ist kein gültiges OCI-Tag-Zeichen).
      - name: Validate SemVer tag
        id: tag
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Tag '$TAG_REF' ist kein gültiger Release-Tag (erwartet vMAJOR.MINOR.PATCH oder -PRERELEASE; Build-Metadaten mit '+' abgelehnt)."
            exit 1
          fi
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then IS_STABLE="false"; else IS_STABLE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION, is_stable=$IS_STABLE"

      # Volle Gates + Image-Integrationstests (DC-FA-DIST-001-AKs);
      # baut zugleich das Runtime-Image mit der Tag-Version.
      - name: Gates + Image-Integrationstests (make ci)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: make ci VERSION="$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE:latest" "$REGISTRY/$IMAGE_NAME:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker tag "$LOCAL_IMAGE:latest" "$REGISTRY/$IMAGE_NAME:latest"
          fi

      # OCI-Label-Pin: die Dockerfile-Labels müssen gesetzt sein, und
      # org.opencontainers.image.version muss exakt der Tag-Version
      # entsprechen — ein Build mit Version-Drift darf nicht shippen.
      - name: Verify OCI labels
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          REF="$REGISTRY/$IMAGE_NAME:v$VERSION"
          for LABEL in \
            org.opencontainers.image.source \
            org.opencontainers.image.description \
            org.opencontainers.image.licenses \
            org.opencontainers.image.title \
            org.opencontainers.image.vendor
          do
            VALUE=$(docker image inspect --format "{{ index .Config.Labels \"$LABEL\" }}" "$REF")
            if [[ -z "$VALUE" ]]; then
              echo "::error::OCI-Label $LABEL ist leer auf $REF."
              exit 1
            fi
            echo "$LABEL=$VALUE"
          done
          IMAGE_VERSION=$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$REF")
          if [[ "$IMAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::org.opencontainers.image.version=[$IMAGE_VERSION] entspricht nicht der Tag-Version [$VERSION]."
            exit 1
          fi
          echo "org.opencontainers.image.version=$IMAGE_VERSION (matcht Tag)"

      - name: Push to GHCR
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/$IMAGE_NAME:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker push "$REGISTRY/$IMAGE_NAME:latest"
          fi
          DIGEST=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$REGISTRY/$IMAGE_NAME:v$VERSION")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### d-check v$VERSION"
            echo ""
            echo "Digest-Pin für Konsumenten:"
            echo ""
            echo '```'
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        id: push

      # Docker-Hub-Spiegel (DC-FA-DIST-002, ADR-0064). Zusage ist DERSELBE
      # Digest, nicht ein zweiter Bau — deshalb wird dasselbe lokale Bild
      # getaggt, das schon nach GHCR ging. Fail-closed: kein
      # continue-on-error und kein Secret-Sondierungs-Schritt; fehlt das
      # Token, ist das Release rot. Der Spiegel steht NACH dem GHCR-Push,
      # damit die Quelle nie hinter dem Spiegel zurueckliegt.
      # Docker-Hub-Spiegel (DC-FA-DIST-002, ADR-0065). Zusage ist derselbe
      # Bild-INHALT, gemessen am Config-Digest — der Manifest-Digest ist
      # registry-lokal (Blob-Neukompression beim zweiten Push) und taugt als
      # Gleichheits-Groesse nicht. Fail-closed: der Spiegel ist eine Zusage.
      # Er steht NACH dem GHCR-Push, damit die Quelle nie hinter ihm
      # zurueckliegt; jeder Abbruch ab hier nennt deshalb den bereits
      # veroeffentlichten GHCR-Stand.
      #
      # Der Login laeuft als `run`-Schritt statt ueber die Action: nur so traegt
      # die Fehlermeldung den GHCR-Digest, den das Negative-Akzeptanzkriterium
      # verlangt — eine `uses:`-Action scheitert mit ihrem eigenen Text.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1 BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io — das Release ist unvollstaendig, der GHCR-Stand aber gueltig. Vorbedingungen: docs/user/releasing.md."
            exit 1
          }
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            fail "Docker-Hub-Zugangsdaten FEHLEN (DOCKERHUB_USERNAME/DOCKERHUB_TOKEN)."
          fi
          if ! printf '%s' "${DOCKERHUB_TOKEN}" \
               | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin 2>/dev/null; then
            fail "Docker-Hub-Anmeldung ABGELEHNT (Zugangsdaten ungueltig oder abgelaufen)."
          fi

      - name: Mirror to Docker Hub
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-check' }}
          GHCR_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Docker-Hub-Spiegel fehlgeschlagen. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io — das Release ist unvollstaendig, der GHCR-Stand aber gueltig."' ERR

          docker tag "$LOCAL_IMAGE:latest" "$DOCKERHUB_IMAGE:v$VERSION"
          docker push "$DOCKERHUB_IMAGE:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker tag "$LOCAL_IMAGE:latest" "$DOCKERHUB_IMAGE:latest"
            docker push "$DOCKERHUB_IMAGE:latest"
          fi

          # Gelesen wird aus den REGISTRIES, nicht aus dem lokalen Daemon: zwei
          # aus demselben lokalen Bild abgeleitete Werte waeren trivial gleich,
          # und ein Vergleich, der nicht fehlschlagen kann, ist ein stiller
          # Gruen-Pfad. `sed -n …p` schweigt statt zu scheitern — sonst risse
          # `pipefail` den Lauf ab, bevor die Leer-Pruefung greift.
          config_digest() {
            docker buildx imagetools inspect --raw "$1" 2>/dev/null \
              | tr -d ' \n' \
              | sed -n 's/.*"config":{[^}]*"digest":"\(sha256:[0-9a-f]\{64\}\)".*/\1/p'
          }
          GHCR_CFG="$(config_digest "$REGISTRY/$IMAGE_NAME:v$VERSION")"
          HUB_CFG="$(config_digest "$DOCKERHUB_IMAGE:v$VERSION")"

          if [[ -z "$GHCR_CFG" || -z "$HUB_CFG" ]]; then
            echo "::error::Config-Digest nicht lesbar (ghcr.io=[${GHCR_CFG:-<leer>}] docker.io=[${HUB_CFG:-<leer>}]). Die Gleichheit ist damit UNGEPRUEFT, nicht bestaetigt. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io."
            exit 1
          fi
          if [[ "$GHCR_CFG" != "$HUB_CFG" ]]; then
            echo "::error::Bild-Inhalt verschieden: ghcr.io=[$GHCR_CFG] docker.io=[$HUB_CFG]. DC-FA-DIST-002 sagt Inhalts-Gleichheit zu. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io."
            exit 1
          fi
          echo "Spiegel traegt denselben Bild-Inhalt: $GHCR_CFG"

          HUB_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$DOCKERHUB_IMAGE:v$VERSION" 2>/dev/null || true)"
          {
            echo ""
            echo "Gespiegelt nach Docker Hub — gleicher Bild-Inhalt (Config-Digest \`$GHCR_CFG\`)."
            echo ""
            echo "Digest-Pin fuer Docker-Hub-Konsumenten (registry-lokal, NICHT der GHCR-Digest):"
            echo ""
            echo '```'
            echo "$DOCKERHUB_IMAGE@${HUB_DIGEST:-<nicht lesbar>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Hub-Darstellung aus Repo-Dateien (packaging/dockerhub/). BEIDE Schritte
      # tragen `continue-on-error`: das Bild ist die Zusage, der
      # Beschreibungstext ist Praesentation, und das Lastenheft sagt zu, dass
      # sein Fehlschlag das Release gruen laesst. Das Zeichen-Limit prueft
      # dagegen `make gates` — es ist eine Eigenschaft einer Repo-Datei und
      # faellt damit beim Schreiben auf, nicht beim Veroeffentlichen.
      - name: Prepare Docker Hub metadata
        id: hubmeta
        continue-on-error: true
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          SRC="packaging/dockerhub/description.txt"
          OVW="packaging/dockerhub/overview.md"
          test -f "$SRC" || { echo "::error::$SRC fehlt."; exit 1; }
          test -f "$OVW" || { echo "::error::$OVW fehlt."; exit 1; }
          DESC="$(head -n 1 "$SRC")"
          [[ -n "$DESC" ]] || { echo "::error::$SRC ist leer."; exit 1; }
          # Fehlt der Platzhalter, zeigte die Hub-Seite eine versionslose
          # Anleitung — das soll auffallen, nicht durchrutschen.
          grep -q '__VERSION__' "$OVW" || { echo "::error::$OVW enthaelt kein __VERSION__."; exit 1; }
          echo "description=$DESC" >> "$GITHUB_OUTPUT"
          sed "s/__VERSION__/v$VERSION/g" "$OVW" > /tmp/dockerhub-overview.md

      - name: Sync Docker Hub description
        id: hubdesc
        if: steps.hubmeta.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-check' }}
          short-description: ${{ steps.hubmeta.outputs.description }}
          readme-filepath: /tmp/dockerhub-overview.md

      # `continue-on-error` setzt `conclusion: success`, aber `outcome` bleibt
      # `failure`. Ohne diesen Schritt versickert ein abgelehnter PATCH im Log:
      # der Lauf ist gruen, die Hub-Seite leer, und niemand erfaehrt es. Genau
      # so passiert beim ersten Spiegel-Lauf (v0.65.0) -- `Forbidden`, weil der
      # Token-Scope `read/write` statt `read/write/delete` trug.
      #
      # ABGRENZUNG: `warning`, nicht `error`. Das Release soll an der
      # DARSTELLUNG nicht scheitern (ADR-0065 Punkt 5) -- es soll nur nicht
      # schweigen.
      - name: Hub-Darstellung — Ausgang melden
        if: always() && steps.hubdesc.outcome == 'failure'
        run: |
          echo "::warning title=Hub-Beschreibung nicht gesetzt::Der PATCH an die Docker-Hub-API wurde abgelehnt. Das Bild IST gespiegelt; nur Kurztext und Overview-Seite fehlen. Haeufigste Ursache: DOCKERHUB_TOKEN traegt Scope read/write statt read/write/delete (der Scope laesst sich am bestehenden Token aendern). Siehe docs/user/releasing.md §Vorbedingungen."

      # GitHub-Release mit dem Digest-Pin in den Notes — der Pin ist
      # die Referenz, die Pilot-Repos (slice-012) konsumieren.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRERELEASE_FLAG=""
          if [[ "$IS_STABLE" != "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            echo "GitHub-Release $TAG existiert bereits — wird wiederverwendet."
          else
            gh release create "$TAG" \
              --title "d-check $TAG" \
              --notes "Siehe [CHANGELOG.md §[$VERSION]](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). Digest-Pin: \`$DIGEST\`" \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG
          fi
