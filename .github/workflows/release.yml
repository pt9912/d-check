name: release

# GHCR-Release-Pipeline (slice-011, DC-FA-DIST-001, ADR-0002, ADR-0014;
# Vorbild: u-boot publish.yml — gleiche Build-Familie).
#
# Trigger: Push von Tags `v*`. Der Validate-Step verwirft alles, was
# nicht `vMAJOR.MINOR.PATCH(-prerelease)?` ist, BEVOR eingeloggt,
# gebaut oder gepusht wird. `:latest` wird ausschließlich für stabile
# Tags gesetzt — ADR-0014 ratifiziert das und löst ADR-0002 §4 insoweit
# ab; Konsumenten werden auf Digest-Pins verwiesen
# (docs/user/releasing.md).
#
# Docker-only-Pfad (AGENTS.md §3.1): `make ci` fährt die kompletten
# Gates inkl. Image-Integrationstests und baut dabei das lokale
# Runtime-Image (`d-check:latest`), das anschließend für GHCR
# umgetaggt und gepusht wird.
#
# Action-Pinning (AGENTS.md §3.9, Supply-Chain-Härtung, u-boot-Konvention):
# alle `uses:`-Einträge sind SHA-gepinnt mit Tag-Kommentar.

on:
  push:
    tags:
      - 'v*'

# Top-level: alles entziehen; der Job lockert nur, was er braucht.
permissions: {}

jobs:
  release:
    name: release (ghcr.io image push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write    # GitHub-Release mit Digest-Pin anlegen
      packages: write
    env:
      DOCKER_BUILDKIT: '1'
      REGISTRY: ghcr.io
      IMAGE_NAME: pt9912/d-check
      # LOCAL_IMAGE muss zum Makefile-Default `IMAGE ?= d-check`
      # passen — `make ci` taggt `$(IMAGE):latest` lokal.
      LOCAL_IMAGE: d-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SemVer-Validate ZUERST (fail-fast vor Login/Build/Push):
      # strikte SemVer-2.0-Prüfung, Build-Metadaten (`+`) abgelehnt
      # ('+' ist kein gültiges OCI-Tag-Zeichen).
      - name: Validate SemVer tag
        id: tag
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Tag '$TAG_REF' ist kein gültiger Release-Tag (erwartet vMAJOR.MINOR.PATCH oder -PRERELEASE; Build-Metadaten mit '+' abgelehnt)."
            exit 1
          fi
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then IS_STABLE="false"; else IS_STABLE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION, is_stable=$IS_STABLE"

      # Volle Gates + Image-Integrationstests (DC-FA-DIST-001-AKs);
      # baut zugleich das Runtime-Image mit der Tag-Version.
      - name: Gates + Image-Integrationstests (make ci)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: make ci VERSION="$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image for GHCR
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE:latest" "$REGISTRY/$IMAGE_NAME:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker tag "$LOCAL_IMAGE:latest" "$REGISTRY/$IMAGE_NAME:latest"
          fi

      # OCI-Label-Pin: die Dockerfile-Labels müssen gesetzt sein, und
      # org.opencontainers.image.version muss exakt der Tag-Version
      # entsprechen — ein Build mit Version-Drift darf nicht shippen.
      - name: Verify OCI labels
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          REF="$REGISTRY/$IMAGE_NAME:v$VERSION"
          for LABEL in \
            org.opencontainers.image.source \
            org.opencontainers.image.description \
            org.opencontainers.image.licenses \
            org.opencontainers.image.title \
            org.opencontainers.image.vendor
          do
            VALUE=$(docker image inspect --format "{{ index .Config.Labels \"$LABEL\" }}" "$REF")
            if [[ -z "$VALUE" ]]; then
              echo "::error::OCI-Label $LABEL ist leer auf $REF."
              exit 1
            fi
            echo "$LABEL=$VALUE"
          done
          IMAGE_VERSION=$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$REF")
          if [[ "$IMAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::org.opencontainers.image.version=[$IMAGE_VERSION] entspricht nicht der Tag-Version [$VERSION]."
            exit 1
          fi
          echo "org.opencontainers.image.version=$IMAGE_VERSION (matcht Tag)"

      - name: Push to GHCR
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/$IMAGE_NAME:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker push "$REGISTRY/$IMAGE_NAME:latest"
          fi
          DIGEST=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$REGISTRY/$IMAGE_NAME:v$VERSION")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### d-check v$VERSION"
            echo ""
            echo "Digest-Pin für Konsumenten:"
            echo ""
            echo '```'
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        id: push

      # Docker-Hub-Spiegel (DC-FA-DIST-002, ADR-0064). Zusage ist DERSELBE
      # Digest, nicht ein zweiter Bau — deshalb wird dasselbe lokale Bild
      # getaggt, das schon nach GHCR ging. Fail-closed: kein
      # continue-on-error und kein Secret-Sondierungs-Schritt; fehlt das
      # Token, ist das Release rot. Der Spiegel steht NACH dem GHCR-Push,
      # damit die Quelle nie hinter dem Spiegel zurueckliegt.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror to Docker Hub
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-check' }}
          GHCR_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Der GHCR-Stand liegt zu diesem Zeitpunkt bereits oeffentlich vor.
          # Jeder Abbruch unter dieser Zeile sagt das ausdruecklich, damit der
          # Teil-Zustand nicht geraten werden muss (DC-FA-DIST-002 Negative).
          trap 'echo "::error::Docker-Hub-Spiegel fehlgeschlagen. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io — das Release ist unvollstaendig, der GHCR-Stand aber gueltig."' ERR

          docker tag "$LOCAL_IMAGE:latest" "$DOCKERHUB_IMAGE:v$VERSION"
          docker push "$DOCKERHUB_IMAGE:v$VERSION"
          if [[ "$IS_STABLE" == "true" ]]; then
            docker tag "$LOCAL_IMAGE:latest" "$DOCKERHUB_IMAGE:latest"
            docker push "$DOCKERHUB_IMAGE:latest"
          fi

          # Die Gleichheit wird GEMESSEN, nicht angenommen (ADR-0064 Punkt 2).
          # RepoDigests fuehrt je Referenz einen Eintrag; gesucht ist der zum
          # Docker-Hub-Namen, nicht "der erste".
          HUB_DIGEST=$(docker image inspect --format '{{ range .RepoDigests }}{{ println . }}{{ end }}' \
            "$DOCKERHUB_IMAGE:v$VERSION" | grep "^${DOCKERHUB_IMAGE}@" | head -1)
          HUB_SHA="${HUB_DIGEST#*@}"
          GHCR_SHA="${GHCR_DIGEST#*@}"
          if [[ -z "$HUB_SHA" || "$HUB_SHA" != "$GHCR_SHA" ]]; then
            echo "::error::Digest-Ungleichheit: ghcr.io=[$GHCR_SHA] docker.io=[$HUB_SHA]. DC-FA-DIST-002 sagt Gleichheit zu; BEREITS VEROEFFENTLICHT ist der GHCR-Stand."
            exit 1
          fi
          echo "Spiegel-Digest stimmt ueberein: $HUB_SHA"
          {
            echo ""
            echo "Gespiegelt nach Docker Hub — gleicher Digest:"
            echo ""
            echo '```'
            echo "$DOCKERHUB_IMAGE@$HUB_SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub-Release mit dem Digest-Pin in den Notes — der Pin ist

      # Hub-Darstellung aus Repo-Dateien (packaging/dockerhub/). Bewusst NICHT
      # fail-closed, anders als der Spiegel darueber: das Bild ist die Zusage
      # (DC-FA-DIST-002), der Beschreibungstext ist Praesentation. Ein Release
      # rot zu machen, weil ein Kurztext nicht gesetzt werden konnte,
      # verwechselte beides.
      - name: Prepare Docker Hub metadata
        id: hubmeta
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          SRC="packaging/dockerhub/description.txt"
          BYTES=$(wc -c < "$SRC")
          # Fail-fast statt stillem Abschneiden durch die Action.
          if [[ "$BYTES" -gt 100 ]]; then
            echo "::error::$SRC ist $BYTES Bytes gross, Docker Hub erlaubt 100."
            exit 1
          fi
          echo "description=$(cat "$SRC")" >> "$GITHUB_OUTPUT"
          sed "s/__VERSION__/v$VERSION/g" packaging/dockerhub/overview.md > /tmp/dockerhub-overview.md

      - name: Sync Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-check' }}
          short-description: ${{ steps.hubmeta.outputs.description }}
          readme-filepath: /tmp/dockerhub-overview.md
      # die Referenz, die Pilot-Repos (slice-012) konsumieren.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRERELEASE_FLAG=""
          if [[ "$IS_STABLE" != "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            echo "GitHub-Release $TAG existiert bereits — wird wiederverwendet."
          else
            gh release create "$TAG" \
              --title "d-check $TAG" \
              --notes "Siehe [CHANGELOG.md §[$VERSION]](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). Digest-Pin: \`$DIGEST\`" \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG
          fi
