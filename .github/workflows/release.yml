name: release

# GHCR-Release-Pipeline (slice-011, DC-FA-DIST-001, ADR-0002, ADR-0014;
# Vorbild: u-boot publish.yml — gleiche Build-Familie).
#
# Trigger: Push von Tags `v*`. Der Validate-Step verwirft alles, was
# nicht `vMAJOR.MINOR.PATCH(-prerelease)?` ist, BEVOR eingeloggt,
# gebaut oder gepusht wird. `:latest` wird ausschließlich für stabile
# Tags gesetzt — ADR-0014 ratifiziert das und löst ADR-0002 §4 insoweit
# ab; Konsumenten werden auf Digest-Pins verwiesen
# (docs/user/releasing.md).
#
# Docker-only-Pfad (AGENTS.md §3.1): `make ci` fährt die kompletten
# Gates inkl. Image-Integrationstests gegen das lokale Runtime-Image
# (`d-check:latest`, linux/amd64); `make image-test-arm64` prüft die
# linux/arm64-Variante. Veröffentlicht wird ein Index beider Plattformen
# (`make image-publish`), dessen Binaries gegen die geprüften verglichen
# werden (DC-FA-DIST-001, ADR-0102).
#
# Action-Pinning (AGENTS.md §3.9, Supply-Chain-Härtung, u-boot-Konvention):
# alle `uses:`-Einträge sind SHA-gepinnt mit Tag-Kommentar.

on:
  push:
    tags:
      - 'v*'

# Top-level: alles entziehen; der Job lockert nur, was er braucht.
permissions: {}

jobs:
  release:
    name: release (ghcr.io image push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Der nachgelagerte hub-description-Job braucht die Tag-Version.
    outputs:
      version: ${{ steps.tag.outputs.version }}
    permissions:
      contents: write    # GitHub-Release mit Digest-Pin anlegen
      packages: write
    env:
      DOCKER_BUILDKIT: '1'
      REGISTRY: ghcr.io
      IMAGE_NAME: pt9912/d-check
      # LOCAL_IMAGE muss zum Makefile-Default `IMAGE ?= d-check`
      # passen — `make ci` taggt `$(IMAGE):latest` lokal.
      LOCAL_IMAGE: d-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SemVer-Validate ZUERST (fail-fast vor Login/Build/Push):
      # strikte SemVer-2.0-Prüfung, Build-Metadaten (`+`) abgelehnt
      # ('+' ist kein gültiges OCI-Tag-Zeichen).
      - name: Validate SemVer tag
        id: tag
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Tag '$TAG_REF' ist kein gültiger Release-Tag (erwartet vMAJOR.MINOR.PATCH oder -PRERELEASE; Build-Metadaten mit '+' abgelehnt)."
            exit 1
          fi
          VERSION="${TAG_REF#v}"
          if [[ "$VERSION" == *-* ]]; then IS_STABLE="false"; else IS_STABLE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_stable=$IS_STABLE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION, is_stable=$IS_STABLE"

      # Volle Gates + Image-Integrationstests (DC-FA-DIST-001-AKs);
      # baut zugleich das Runtime-Image mit der Tag-Version.
      - name: Gates + Image-Integrationstests (make ci)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: make ci VERSION="$VERSION"

      # Die zweite Plattform des Index (DC-FA-DIST-001, ADR-0102): QEMU fuer
      # den arm64-Test (Binary und Container), buildx fuer den Index-Build.
      # Gebaut wird per Cross-Compile, emuliert wird nur der Test.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image-Integrationstests linux/arm64 (make image-test-arm64)
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: make image-test-arm64 VERSION="$VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI-Label-Pin VOR dem Push, an beiden geprueften Bildern: die
      # Dockerfile-Labels muessen gesetzt sein, und
      # org.opencontainers.image.version muss exakt der Tag-Version
      # entsprechen — ein Build mit Version-Drift darf nicht shippen. Nach dem
      # Push prueft image-verify-published.sh dieselben Labels je Plattform aus
      # der Registry.
      - name: Verify OCI labels
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          for REF in "$LOCAL_IMAGE:latest" "$LOCAL_IMAGE:arm64"; do
            for LABEL in \
              org.opencontainers.image.source \
              org.opencontainers.image.description \
              org.opencontainers.image.licenses \
              org.opencontainers.image.title \
              org.opencontainers.image.vendor
            do
              VALUE=$(docker image inspect --format "{{ index .Config.Labels \"$LABEL\" }}" "$REF")
              if [[ -z "$VALUE" ]]; then
                echo "::error::OCI-Label $LABEL ist leer auf $REF."
                exit 1
              fi
              echo "$REF $LABEL=$VALUE"
            done
            IMAGE_VERSION=$(docker image inspect --format \
              '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$REF")
            if [[ "$IMAGE_VERSION" != "$VERSION" ]]; then
              echo "::error::org.opencontainers.image.version=[$IMAGE_VERSION] auf $REF entspricht nicht der Tag-Version [$VERSION]."
              exit 1
            fi
            echo "$REF org.opencontainers.image.version=$IMAGE_VERSION (matcht Tag)"
          done

      # Index-Build und Push, danach die Gegenprobe gegen den GEPUSHTEN Index
      # (Plattformen, Labels je Plattform, Binary je Plattform gleich dem
      # geprueften) — make image-publish, ADR-0102. Der Konsumenten-Pin ist
      # der Index-Digest.
      - name: Push to GHCR
        id: push
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Index-Push oder Gegenprobe fehlgeschlagen. Unter $REGISTRY/$IMAGE_NAME:v$VERSION kann bereits ein Index liegen — vor einem erneuten Lauf pruefen."' ERR
          make image-publish VERSION="$VERSION" \
            PUBLISH_REPO="$REGISTRY/$IMAGE_NAME" PUBLISH_LATEST="$IS_STABLE"
          INDEX="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$REGISTRY/$IMAGE_NAME:v$VERSION")"
          DIGEST="$REGISTRY/$IMAGE_NAME@$INDEX"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### d-check v$VERSION"
            echo ""
            echo "Digest-Pin für Konsumenten (Index linux/amd64 + linux/arm64):"
            echo ""
            echo '```'
            echo "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Docker-Hub-Spiegel (DC-FA-DIST-002, ADR-0102). Der Spiegel KOPIERT den
      # GHCR-Index samt Blobs (imagetools create), statt ein Bild neu zu
      # pushen; die Gleichheits-Groesse ist der Index-Digest, aus beiden
      # Registries gelesen. Fail-closed: der Spiegel ist eine Zusage. Er steht
      # NACH dem GHCR-Push, damit die Quelle nie hinter ihm zurueckliegt; jeder
      # Abbruch ab hier nennt deshalb den bereits veroeffentlichten GHCR-Stand.
      #
      # Der Login laeuft als `run`-Schritt statt ueber die Action: nur so traegt
      # die Fehlermeldung den GHCR-Digest, den das Negative-Akzeptanzkriterium
      # verlangt — eine `uses:`-Action scheitert mit ihrem eigenen Text.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1 BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io — das Release ist unvollstaendig, der GHCR-Stand aber gueltig. Vorbedingungen: docs/user/releasing.md."
            exit 1
          }
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            fail "Docker-Hub-Zugangsdaten FEHLEN (DOCKERHUB_USERNAME/DOCKERHUB_TOKEN)."
          fi
          if ! printf '%s' "${DOCKERHUB_TOKEN}" \
               | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin 2>/dev/null; then
            fail "Docker-Hub-Anmeldung ABGELEHNT (Zugangsdaten ungueltig oder abgelaufen)."
          fi

      - name: Mirror to Docker Hub
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'pt9912/d-check' }}
          GHCR_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'echo "::error::Docker-Hub-Spiegel fehlgeschlagen. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io — das Release ist unvollstaendig, der GHCR-Stand aber gueltig."' ERR

          TAGS=(-t "$DOCKERHUB_IMAGE:v$VERSION")
          if [[ "$IS_STABLE" == "true" ]]; then
            TAGS+=(-t "$DOCKERHUB_IMAGE:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$GHCR_DIGEST"

          # Gelesen wird aus den REGISTRIES: zwei aus derselben Quelle
          # abgeleitete Werte waeren trivial gleich, und ein Vergleich, der
          # nicht fehlschlagen kann, ist ein stiller Gruen-Pfad. Eine leere
          # Antwort ist UNGEPRUEFT, nicht bestaetigt.
          index_digest() {
            docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1" 2>/dev/null \
              | sed -n 's/^\(sha256:[0-9a-f]\{64\}\)$/\1/p'
          }
          GHCR_IDX="$(index_digest "$REGISTRY/$IMAGE_NAME:v$VERSION")"
          HUB_IDX="$(index_digest "$DOCKERHUB_IMAGE:v$VERSION")"

          if [[ -z "$GHCR_IDX" || -z "$HUB_IDX" ]]; then
            echo "::error::Index-Digest nicht lesbar (ghcr.io=[${GHCR_IDX:-<leer>}] docker.io=[${HUB_IDX:-<leer>}]). Die Gleichheit ist damit UNGEPRUEFT, nicht bestaetigt. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io."
            exit 1
          fi
          if [[ "$GHCR_IDX" != "$HUB_IDX" ]]; then
            echo "::error::Index verschieden: ghcr.io=[$GHCR_IDX] docker.io=[$HUB_IDX]. DC-FA-DIST-002 sagt denselben Index-Digest zu. BEREITS VEROEFFENTLICHT: ${GHCR_DIGEST} auf ghcr.io."
            exit 1
          fi
          echo "Spiegel traegt denselben Index: $GHCR_IDX"

          {
            echo ""
            echo "Gespiegelt nach Docker Hub — derselbe Index-Digest, derselbe Pin:"
            echo ""
            echo '```'
            echo "$DOCKERHUB_IMAGE@$HUB_IDX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Die Hub-Darstellung setzt ein EIGENER Workflow (hub-description.yml),
      # den dieser hier als Job unten aufruft. Grund: sie hing bis v0.65.0 nur
      # am Tag und ist deshalb still gescheitert, ohne je probbar gewesen zu
      # sein. Als eigener Workflow traegt sie `workflow_dispatch` und laesst
      # sich jederzeit ausloesen — die Mechanik bleibt an EINEM Ort.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          IS_STABLE: ${{ steps.tag.outputs.is_stable }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRERELEASE_FLAG=""
          if [[ "$IS_STABLE" != "true" ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "$TAG" --json tagName --jq '.tagName' >/dev/null 2>&1; then
            echo "GitHub-Release $TAG existiert bereits — wird wiederverwendet."
          else
            gh release create "$TAG" \
              --title "d-check $TAG" \
              --notes "Siehe [CHANGELOG.md §[$VERSION]](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md). Digest-Pin: \`$DIGEST\`" \
              --target "$GITHUB_SHA" \
              $PRERELEASE_FLAG
          fi

  # Nach dem Release, nicht darin: die Darstellung ist Praesentation, kein
  # Bestandteil der Distributions-Zusage (ADR-0065 Punkt 5). Ein Fehlschlag
  # meldet und macht das Release nicht rot.
  hub-description:
    name: Hub-Darstellung
    needs: release
    # Der aufgerufene Workflow verlangt `contents: read`; ein aufrufender Job
    # kann nur weitergeben, was er selbst hat, und erbt hier sonst das
    # `permissions: {}` des Workflow-Kopfes. Ohne diese Zeile lehnt GitHub den
    # GANZEN Lauf vor dem ersten Job ab (startup_failure, kein Log) — gemessen
    # am Tag-Push von v0.66.0. `make workflow-pins` sieht das nicht: es prueft
    # die Existenz des Ziels, nicht seine Rechte-Anforderung.
    permissions:
      contents: read
    uses: ./.github/workflows/hub-description.yml
    with:
      version: v${{ needs.release.outputs.version }}
    secrets: inherit
