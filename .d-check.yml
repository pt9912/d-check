  # tools/harness/workflow-pins.sh ist im Modul `workflows` aufgegangen und
  # entfernt. Die Verweise darauf stehen in EINGEFRORENEN Artefakten -- zwei
  # immutable Accepted-ADRs, ein done/-Slice und die Review-Reports, die den
  # Waechter zur ihrer Zeit geprueft haben. Sie nachzuziehen wuerde Belege
  # verfaelschen (dieselbe Begruendung wie beim Review-Report-Eintrag oben);
