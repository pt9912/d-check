# d-check prüft sich selbst (Dogfooding, slice-004 / MR-007;
# Selbstkonfiguration ids+matrix: slice-007, codepaths: slice-013,
# spans: slice-015, hostpaths: slice-016).
# "." = gesamte Repo-Wurzel; SKIP_DIRS (.git, vendor, …) gelten immer.
# ignore: die lokale Lese-Form der adoptierten Baseline trägt Fremdinhalt — die
# Kurs-Docs referenzieren ihre eigenen IDs/Pfade, die hier nicht existieren.
# Selbe Klasse wie die eingebauten SKIP_DIRS (Fremd-/Generiertes); kein eigener
# Doku-Vertrag, also aus dem Dogfooding-Scan ausgenommen statt geprüft. Zwei
# Pfade, weil Regelwerk und Templates unterschiedlich verkörpert werden:
#   .harness/baseline/<tag>/  — committetes, vendortes Regelwerk (MR-019)
#   .harness/cache/<tag>/     — gitignorierter, ephemerer Cache (Templates-
#                               Staging, MR-017/MR-018)
scan:
  roots: ["."]
  ignore: [".harness/baseline/**", ".harness/cache/**"]
modules: [links, anchors, ids, matrix, codepaths, spans, hostpaths, versions]

# Geteiltes Referenz-Ventil (DC-FA-REF-001): Ziel-Achsen-Pendant zu scan.ignore
# (jenes entfernt Quell-Dateien, dieses Ziel-Referenzen), honoriert von
# links/anchors/codepaths. Tombstone der Baseline-Migration v1.4.0 -> v5.0.0
# (slice-084 / MR-023): drei EINGEFRORENE Verweise (immutable ADR-0022 + done/-
# Slices 080/081) zitieren den entfernten .harness/baseline/v1.4.0/-Pfad als
# Historie — quell-skopiert (in) von der Existenzpruefung ausgenommen, ohne die
# eingefrorene Doku zu editieren. Die live-Fundstellen sind auf v5.0.0 retargetet.
# Ortsfeste Verweise (DC-FA-LINK-001 §Ortsfeste Verweise, ADR-0056): eine
# Datei in einem wandernden Lifecycle-Verzeichnis muss jedes relative Ziel von
# JEDEM Ort der Gruppe aufloesen -- und ueberall auf dasselbe. Vor dem
# Scharfschalten gemessen: heutiger Bestand 0; retro gegen den Stand vor der
# welle-69-Eroeffnung meldet das Produkt 19 Befunde (15 davon Teil des realen
# Bruchs; dessen uebrige vier waren Ziel-Wanderungen -- benannte Grenze). Der
# Ruheort ist fixed (seine Dateien wandern nie wieder -- sonst 108
# Falsch-Positive).
links:
  resolve-from:
    - dirs:
        - docs/plan/planning/open
        - docs/plan/planning/next
        - docs/plan/planning/in-progress
      fixed-dirs:
        - docs/plan/planning/done

ignore-refs:
  # Review-Reports sind LAUF-BELEGE: sie halten fest, was zur Review-Zeit galt.
  # Als slice-099/100 nach dem Review zu einem Slice zusammengeführt wurden,
  # zeigten ihre Verweise ins Leere. Die Reports nachzuziehen wäre der falsche
  # Fix gewesen — ein Link, dessen Label nicht mehr zum Ziel passt, verfälscht
  # den Beleg (Re-Review-Befund). Das Ventil hält den Report unangetastet und
  # das Gate ehrlich; `codepaths.exempt-paths` nimmt docs/reviews aus demselben
  # Grund bereits aus.
  - in: "docs/reviews/2026-08-09-*.md"
    refs:
      - "docs/plan/planning/open/slice-099-structure-modul-kern.md"
      - "docs/plan/planning/open/slice-099-structure-modul.md"
      - "docs/plan/planning/open/slice-100-structure-marken-und-zaehlung.md"
      - "docs/plan/planning/in-progress/slice-096-structure-modul-analyse.md"
      - "docs/plan/planning/welle-69-structure-schnitt.md"
      - "docs/plan/planning/open/slice-101-fence-unbalanciert.md"
      - "docs/plan/planning/open/slice-098-closure-note-placeholder.md"
      - "docs/plan/planning/open/slice-094-closure-zaehl-paritaet.md"
      - "docs/plan/planning/in-progress/slice-094-closure-zaehl-paritaet.md"
      - "docs/plan/planning/in-progress/slice-101-fence-unbalanciert.md"
      - "docs/plan/planning/open/slice-097-closure-glob-entkopplung.md"
  - in: "docs/reviews/2026-08-10-*.md"
    refs:
      - "docs/plan/planning/in-progress/slice-097-closure-glob-entkopplung.md"
      - "docs/plan/planning/in-progress/slice-098-closure-note-placeholder.md"
      - "docs/plan/planning/in-progress/slice-104-floskel-wortgrenze.md"
      - "docs/plan/planning/welle-72-closure-semantik.md"
      - "docs/plan/planning/open/slice-098-closure-note-placeholder.md"
  - in: docs/plan/adr/0022-matrix-token-richtung-provenance-marker.md
    refs: [".harness/baseline/v1.4.0/**"]
  - in: docs/plan/planning/done/slice-080-sources-modul.md
    refs: [".harness/baseline/v1.4.0/**"]
  - in: docs/plan/planning/done/slice-081-pins-hash-ergonomie.md
    refs: [".harness/baseline/v1.4.0/**"]

# Linkpflicht für Kennungen (DC-FA-ID-001): nackte IDs im Fließtext
# müssen auf ihre Definition verlinken. Reihenfolge = Präzedenz.
# Dogfooding der Link-Politik (slice-018): link-policy: always macht
# auch Inline-Code-Vorkommen linkpflichtig — „gut verlinkt" als
# gemessenes Property. exempt-paths nimmt literal-schwere Artefakte
# (Changelog, Review-Reports) aus; Beispiel-IDs tragen d-check:ignore.
ids:
  patterns:
    - regex: 'ADR-\d{4}'
      target: docs/plan/adr/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'MR-\d{3}'
      target: harness/conventions/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'DC-(FA-[A-Z]+|QA)-\d+'
      target: spec/lastenheft.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]

# Referenzmatrix (DC-FA-MTX-001 zwischen Klassen, -002 innerhalb, -003 als Token):
# maschinelle Kodierung von MR-006 — Spec-Straten verweisen nie abwärts auf
# ADRs/Planning (rules), nicht abwärts auf die autoritativere Spec-Schicht
# (order/direction), und ADRs nennen Slices nicht abwärts als Token im Körper
# (token + adr→slice + Provenance-Marker). architecture → spezifikation → lastenheft.
matrix:
  classes:
    - name: spec-straten
      paths: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]
      # Klasseninterne Verweisrichtung (DC-FA-MTX-002): Rang = autoritativste
      # Schicht zuerst; ein Abwärtsverweis (z. B. lastenheft → architecture,
      # auch transitiv) ⇒ matrix-downward.
      order: [spec/lastenheft.md, spec/spezifikation.md, spec/architecture.md]
      direction: no-downward
    - name: adr
      paths: ["docs/plan/adr/[0-9]*.md"]
    - name: slice
      paths: ["docs/plan/planning/**/slice-*.md"]
      # Token-Erkennung (DC-FA-MTX-003): eine Slice-Kennung im ADR-/Spec-Körper
      # ist eine Token-Referenz → matrix-forbidden, außer per Provenance-Marker
      # <!-- d-check:status-provenance --> deklariert (ADRs verweisen abwärts nur
      # als deklarierte Provenance/Verifikations-Zeiger, nie als Entscheidungsgrundlage).
      token: 'slice-\d{3}'
  rules:
    - {from: spec-straten, to: adr, allow: false}
    - {from: spec-straten, to: slice, allow: false}
    - {from: adr, to: slice, allow: false}
  status:
    forbidden: [superseded, deprecated]
  # exakter Heading-Vergleich. Nur die immutable ADR-Geschichte bleibt
  # provenance-exempt; die Spec-Straten-"7. Historie" ist NICHT mehr ausgenommen
  # (v5.0.0/ADR-0047: die Referenz-Richtung gilt auch in der Historie — die §7-Chronik
  # ist entkoppelt/token-frei, die Verweis-Spalte entfernt).
  exclude-sections: [Geschichte]
  # Grandfathering (DC-FA-MTX-003): die vor Einführung Accepted-ADRs (0001–0021)
  # sind immutabel und nennen Slices als legitime Verifikations-Zeiger im Körper
  # — sie werden ganz übersprungen; neue ADRs ab 0022 tragen den Marker.
  exempt-paths: ["docs/plan/adr/00[01][0-9]-*.md", "docs/plan/adr/002[01]-*.md"]

# Pfade in Inline-Code (DC-FA-CODE-001): ./ und ../ immer; dazu die
# Wurzel-Präfixe der eigenen Verzeichniskonvention.
codepaths:
  roots: [docs, spec, tools, harness, internal, cmd]
  # Review-Reports zitieren naturgemäß Datei:Zeile/Pfade — wie bei ids
  # vom Datei-Ventil ausgenommen (DC-FA-CODE-001, slice-043).
  exempt-paths: ["docs/reviews/**"]
  # Tombstone-Register (DC-FA-CODE-001, ADR-0025, slice-054): bewusst
  # entfernte Artefakte, die immutable/historische Doku noch in Inline-Code
  # zitiert — referenz-weit von der Existenz-Prüfung ausgenommen.
  # - adr-immutable-check.sh: abgelöst durch Modul vcs (ADR-0024, slice-053)
  # - completeness-check.sh: abgelöst durch --trace --require-complete (ADR-0026, slice-055)
  # - trace-check.sh: abgelöst durch Modul commits (ADR-0027, slice-056)
  # - planning-consistency.sh: abgelöst durch Modul planning (ADR-0028, slice-057)
  # - arch-check.sh: abgelöst durch das Schwester-Tool a-check (ADR-0029, slice-058)
  # - gate-consistency.sh: Prüfung 3 (DC-QA-03-Modulliste) → Go-Test, Kern via Modul targets (ADR-0032, slice-064)
  ignore-refs: ["tools/adr-immutable-check.sh", "tools/completeness-check.sh", "tools/trace-check.sh", "tools/planning-consistency.sh", "tools/arch-check.sh", "tools/gate-consistency.sh"]

# Versions-Pin-Konsistenz (DC-FA-VER-001, slice-048): jeder ghcr-Image-Pin in
# den Live-Docs muss die aktuelle Version aus version.md#aktuell tragen — sonst
# version-stale (auch in Fenced-Code, gescopte Fence-Ausnahme). exempt-paths
# nimmt historische Pins (done/-Slices, Changelog, Review-Reports) aus; die
# current-from-Datei (version.md) ist selbst ausgenommen.
versions:
  pin-pattern: 'ghcr\.io/[^\s:]+:(v[0-9]+\.[0-9]+\.[0-9]+)'
  current-from: version.md#aktuell
  # historische Pins (DC-FA-VER-001): done/-Slices, Changelog, Lastenheft-
  # Historie, Review-Reports bleiben unberührt.
  exempt-paths: [CHANGELOG.md, "docs/plan/planning/done/**", spec/lastenheft.md, "docs/reviews/**"]

# Modul vcs (DC-FA-VCS-001, slice-053): git-Diff-Immutabilität der eigenen
# Accepted-ADRs über die Commit-Range — `make adr-check` aktiviert es mit
# `--enable vcs` (NICHT in der modules-Liste oben, daher im Default-doc-check
# inert/byte-identisch). Core in Parität zum abgelösten `adr-immutable-check.sh`
# (nur Kopf-Status-Zeile gestrippt, Geschichte ausgenommen); löst dessen Mechanik
# ab (ADR-0024, Teil-Supersede von ADR-0016).
vcs:
  paths: ["docs/plan/adr/[0-9]*.md"]
  immutable-when: '^\*\*Status:\*\* Accepted'
  exclude-sections: [Geschichte]
  status-line: '^\*\*Status:\*\*'
  head-allow: '^\*\*Status:\*\* (Accepted|Superseded by ADR-[0-9]{4})'

# Modul commits (DC-FA-COMMITS-001, slice-056): Traceability-Kennung in
# Commit-Messages über eine Range — `make trace-check` aktiviert es mit
# `--enable commits` (NICHT in der modules-Liste oben, daher im Default-doc-check
# inert/byte-identisch). id-patterns = die drei ids-Muster (ADR/MR/DC) plus
# slice-NNN (eine ID-Definition neben ids.patterns, statt im Skript-ID_RE);
# exempt-pattern nimmt Merge-/Revert-Betreffe aus. Löst tools/trace-check.sh ab
# (ADR-0027, Supersedes die Skript-Mechanik von ADR-0013).
commits:
  id-patterns:
    - 'ADR-\d{4}'
    - 'MR-\d{3}'
    - 'DC-(FA-[A-Z]+|QA)-\d+'
    - 'slice-\d+'
  exempt-pattern: '^(Merge |Revert )'

# Modul planning (DC-FA-PLAN-001, slice-057): Roadmap-↔-in-progress-Lifecycle-
# Konsistenz — `make planning-check` aktiviert es mit `--enable planning` (NICHT in
# der modules-Liste oben, daher im Default-doc-check inert). Hermetisch (nur die
# Roadmap-Datei + Verzeichnis-Listing, kein git, kein Netz); heading/marker/slice-glob
# per Default (`## Aktuelle Welle` / „Keine aktive Welle" / `slice-*.md`). Löst
# tools/planning-consistency.sh ab (ADR-0028, letztes Familien-Skript des tools/*.sh-Audits).
planning:
  roadmap: docs/plan/planning/in-progress/roadmap.md
  # Dritte Faehigkeit (DC-FA-PLAN-001 §Wellen-Invariante, ADR-0055): dieselbe
  # Lifecycle-Invariante eine Ebene hoeher. Vor dem Scharfschalten am eigenen
  # Bestand gemessen -- 0 Befunde; im Schwester-Repo elf fehlende
  # Ergebnisnotizen (robust; ein zwoelfter Probe-Befund war ein Artefakt des
  # Default-Markers). Die Gegenrichtung (Notiz ohne Registerzeile) ist
  # hier im August dreimal eingetreten und wurde von Hand gefunden.
  # Alle uebrigen Schluessel stehen auf den Konventions-Defaults.
  waves:
    dir: docs/plan/planning

# Modul targets (DC-FA-TGT-001, slice-063): Deklarations-Konsistenz Doku ↔
# Build-Targets — `make gate-consistency` aktiviert es mit `--enable targets`
# (NICHT in der modules-Liste oben, daher im Default-doc-check inert). Hermetisch
# (Filesystem-Port, kein git/Netz/Makefile-Ausführen): ein in einer Doku-Tabellen-
# zeile behauptetes `make X` ohne Makefile-Regel ⇒ gate-phantom; jede Makefile-
# Regel ohne Eintrag in der Autoritäts-Doku (AGENTS.md §4) ⇒ gate-undocumented.
# exempt-targets bleibt leer — d-check dokumentiert alle Targets in AGENTS.md §4
# (die erschöpfende Prüfung des abgelösten gate-consistency.sh-Kerns). Löst den
# Doku-↔-Makefile-Kern von tools/gate-consistency.sh ab (ADR-0031).
targets:
  makefiles: [Makefile]
  doc-tables: [AGENTS.md, harness/README.md]
  authority: AGENTS.md
  exempt-targets: []

# --trace ist ein Flag-Modus (DC-FA-CLI-009), KEIN --enable-Modul — steht daher
# NICHT in der modules-Liste oben. d-check dogfoodet ihn über `make trace` (advisory
# RTM) und `make completeness-check`/`doc-complete` (--require-complete, DC-FA-CLI-011,
# in fullbuild). Der Block setzt die vier RTM-Konventionen auf EXAKT ihre Defaults
# (spezifikation.md §2) — die RTM bleibt byte-identisch (DC-QA-02). Einziger Verhaltens-
# Effekt: `requirements.source` ist NICHTLEER explizit gesetzt und armiert damit den
# fail-closed Nullmengen-Guard (DC-FA-REQ-001, ADR-0037, slice-070): verlöre
# spec/lastenheft.md je die Heading-Konvention (0 erkannte Anforderungen), bräche
# `make trace`/`completeness-check` mit Exit 2 statt still-grün mit leerer RTM. Heute
# nachweislich safe (42 Anforderungen, 0 Waisen).
trace:
  requirements:
    # explizit nichtleer = Guard scharf (leer/abwesend ⇒ Default ohne Guard)
    source: spec/lastenheft.md
    # Default-Regex: Anforderungs-Kennung als Ganz-Token im Heading
    id-pattern: '[A-Z][A-Z0-9]*-(?:FA-[A-Z]+|QA)-\d+[A-Za-z]?'
  adrs:
    dir: docs/plan/adr
    file-pattern: '^(\d{4})-.*\.md$'      # Capture-Gruppe 1 = NNNN
    id-prefix: 'ADR-'                      # ⇒ ADR-NNNN
  slices:
    dir: docs/plan/planning
    file-pattern: '^(slice-\d+)-.*\.md$'   # Capture-Gruppe 1 = volle Kennung slice-NNN
    id-prefix: ''                          # leer: der Dateiname trägt die volle Kennung
