# d-check prüft sich selbst (Dogfooding, slice-004 / MR-007;
# Selbstkonfiguration ids+matrix: slice-007, codepaths: slice-013,
# spans: slice-015, hostpaths: slice-016).
# "." = gesamte Repo-Wurzel; SKIP_DIRS (.git, vendor, …) gelten immer.
# ignore: die lokale Lese-Form der adoptierten Baseline trägt Fremdinhalt — die
# Kurs-Docs referenzieren ihre eigenen IDs/Pfade, die hier nicht existieren.
# Selbe Klasse wie die eingebauten SKIP_DIRS (Fremd-/Generiertes); kein eigener
# Doku-Vertrag, also aus dem Dogfooding-Scan ausgenommen statt geprüft. Zwei
# Pfade, weil Regelwerk und Templates unterschiedlich verkörpert werden:
#   .harness/baseline/<tag>/  — committetes, vendortes Regelwerk (MR-019)
#   .harness/cache/<tag>/     — gitignorierter, ephemerer Cache (Templates-
#                               Staging, MR-017/MR-018)
scan:
  roots: ["."]
  ignore: [".harness/baseline/**", ".harness/cache/**"]
# citations ist das EINZIGE fail-closed Modul dieser Liste: eine strukturell
# unbrauchbare Direktive beendet den ganzen Lauf mit Exit 2, auch im
# pre-commit-Hook. Tragbar, seit die Direktive nur ausserhalb von Inline-Code
# zaehlt (ADR-0060) — die Syntax-Doku ist damit keine Fundstelle mehr.
# EINE planmaessige Rot-Quelle ist der Baseline-Bump: er verschiebt die
# Zeilenspannen, und MR-051 legt das Neu-Ankern in die Bump-Prozedur. Eine
# Direktive auf ein repo-internes Ziel meldet dagegen bei JEDER Aenderung des
# Ziels — auch dafuer gilt: neu ankern, nicht loeschen (MR-051).
# Grenze: d-check:ignore greift hier NICHT — das Modul kennt keine feine
# Ventil-Achse; grob wirken nur scan.ignore und citations.scope.
#
# Diese Liste hat Spiegel ausserhalb dieser Datei (BEO-010): FOCUS_DISABLE im
# Makefile und netlessDocModules() im Go-Test. Beide sind hier nachzuziehen.
modules: [links, anchors, ids, matrix, codepaths, spans, hostpaths, versions, structure, diagrams, citations]

# Geteiltes Referenz-Ventil (DC-FA-REF-001): Ziel-Achsen-Pendant zu scan.ignore
# (jenes entfernt Quell-Dateien, dieses Ziel-Referenzen), honoriert von
# links/anchors/codepaths. Tombstone der Baseline-Migration v1.4.0 -> v5.0.0
# (slice-084 / MR-023): drei EINGEFRORENE Verweise (immutable ADR-0022 + done/-
# Slices 080/081) zitieren den entfernten .harness/baseline/v1.4.0/-Pfad als
# Historie — quell-skopiert (in) von der Existenzpruefung ausgenommen, ohne die
# eingefrorene Doku zu editieren. Die live-Fundstellen sind auf v5.0.0 retargetet.
# Ortsfeste Verweise (DC-FA-LINK-001 §Ortsfeste Verweise, ADR-0056): eine
# Datei in einem wandernden Lifecycle-Verzeichnis muss jedes relative Ziel von
# JEDEM Ort der Gruppe aufloesen -- und ueberall auf dasselbe. Vor dem
# Scharfschalten gemessen: heutiger Bestand 0; retro gegen den Stand vor der
# welle-69-Eroeffnung meldet das Produkt 19 Befunde (15 davon Teil des realen
# Bruchs; dessen uebrige vier waren Ziel-Wanderungen -- benannte Grenze). Der
# Ruheort ist fixed (seine Dateien wandern nie wieder -- sonst 108
# Falsch-Positive).
links:
  resolve-from:
    - dirs:
        - docs/plan/planning/open
        - docs/plan/planning/next
        - docs/plan/planning/in-progress
      fixed-dirs:
        - docs/plan/planning/done

ignore-refs:
  # Review-Reports sind LAUF-BELEGE: sie halten fest, was zur Review-Zeit galt.
  # Als slice-099/100 nach dem Review zu einem Slice zusammengeführt wurden,
  # zeigten ihre Verweise ins Leere. Die Reports nachzuziehen wäre der falsche
  # Fix gewesen — ein Link, dessen Label nicht mehr zum Ziel passt, verfälscht
  # den Beleg (Re-Review-Befund). Das Ventil hält den Report unangetastet und
  # das Gate ehrlich; `codepaths.exempt-paths` nimmt docs/reviews aus demselben
  # Grund bereits aus.
  - in: "docs/reviews/2026-08-09-*.md"
    refs:
      - "docs/plan/planning/open/slice-099-structure-modul-kern.md"
      - "docs/plan/planning/open/slice-099-structure-modul.md"
      - "docs/plan/planning/open/slice-100-structure-marken-und-zaehlung.md"
      - "docs/plan/planning/in-progress/slice-096-structure-modul-analyse.md"
      - "docs/plan/planning/welle-69-structure-schnitt.md"
      - "docs/plan/planning/open/slice-101-fence-unbalanciert.md"
      - "docs/plan/planning/open/slice-098-closure-note-placeholder.md"
      - "docs/plan/planning/open/slice-094-closure-zaehl-paritaet.md"
      - "docs/plan/planning/in-progress/slice-094-closure-zaehl-paritaet.md"
      - "docs/plan/planning/in-progress/slice-101-fence-unbalanciert.md"
      - "docs/plan/planning/open/slice-097-closure-glob-entkopplung.md"
  - in: "docs/reviews/2026-08-10-*.md"
    refs:
      - "docs/plan/planning/in-progress/slice-097-closure-glob-entkopplung.md"
      - "docs/plan/planning/in-progress/slice-098-closure-note-placeholder.md"
      - "docs/plan/planning/in-progress/slice-104-floskel-wortgrenze.md"
      - "docs/plan/planning/welle-72-closure-semantik.md"
      - "docs/plan/planning/open/slice-098-closure-note-placeholder.md"
  - in: docs/plan/adr/0022-matrix-token-richtung-provenance-marker.md
    refs: [".harness/baseline/v1.4.0/**"]
  - in: docs/plan/planning/done/slice-080-sources-modul.md
    refs: [".harness/baseline/v1.4.0/**"]
  - in: docs/plan/planning/done/slice-081-pins-hash-ergonomie.md
    refs: [".harness/baseline/v1.4.0/**"]
  # Tombstone der Baseline-Migration v5.0.0 -> v5.6.0 (slice-106 / MR-026):
  # dieselbe Klasse wie oben — EINGEFRORENE Verweise auf den entfernten
  # v5.0.0-Baum. Die immutablen Accepted-ADRs 0047/0048 und die drei
  # Review-Reports mit Markdown-LINKS dorthin (Lauf-Belege; die uebrigen
  # Reports nennen den Pfad nur in Inline-Code, den ids/codepaths fuer
  # docs/reviews ohnehin ausnehmen) zitieren ihn als Historie;
  # quell-skopiert ausgenommen statt eingefrorene Doku zu editieren. Die
  # live-Fundstellen sind auf v5.6.0 retargetet (MR-021).
  - in: docs/plan/adr/0047-matrix-spec-historie-nicht-provenance-exempt.md
    refs: [".harness/baseline/v5.0.0/**"]
  - in: docs/plan/adr/0048-closure-note-struktur-im-planning-modul.md
    refs: [".harness/baseline/v5.0.0/**"]
  - in: docs/reviews/2026-08-02-slice-091-status-feld-review.md
    refs: [".harness/baseline/v5.0.0/**"]
  - in: docs/reviews/2026-08-09-backlog-schnitt-review.md
    refs: [".harness/baseline/v5.0.0/**"]
  - in: docs/reviews/2026-08-09-slice-096-vertrag-review.md
    refs: [".harness/baseline/v5.0.0/**"]
  # Der slice-136-Report zitiert einen Markdown-Link WÖRTLICH aus dem
  # Bedienhinweis der Architektur-Vorlage. Er löst von der Vorlage aus auf, vom
  # Report aus nicht — quell-skopiert ausgenommen, statt das Zitat zu
  # verfälschen.
  - in: docs/reviews/2026-08-23-slice-136-agents-34-klaerung-review.md
    refs: ["regelwerk/**"]
  # Tombstone der Baseline-Migration v5.11.0 -> v5.12.0 (MR-037): dieselbe
  # Klasse eine Hebung spaeter, aber ZWEI Eintraege statt vierzehn. Der
  # Quell-Skopus ist diesmal ein Glob ueber die beiden EINGEFRORENEN
  # Verzeichnisse, weil die betroffene Menge mit jedem Bump waechst und eine
  # Datei-Liste genau das waere, was dieses Repo an Listen beanstandet: sie
  # haelt nur so lange, wie jemand sie pflegt. Die refs-Seite bleibt eng --
  # ausgenommen ist ausschliesslich der ENTFERNTE Baum, nicht der gepinnte.
  #
  # DER PREIS IST BENANNT: ein Glob deckt auch KUENFTIGE Dateien. Ein Report,
  # der morgen entsteht und auf den entfernten v5.11.0-Baum zeigt, bleibt stumm
  # -- gemessen: dieselbe Referenz meldet ausserhalb dieser Verzeichnisse
  # target-missing, darin nicht. Bewusst in Kauf genommen, weil ein Report den
  # Stand SEINER Zeit zitiert und ein Zeiger auf einen abgeloesten Baum dort
  # kein Defekt ist. Fuer den gepinnten Baum gilt das nicht: dorthin zeigende
  # tote Links melden weiterhin, auch aus done/ und docs/reviews/.
  - in: docs/plan/planning/done/**
    refs: [".harness/baseline/v5.11.0/**"]
  - in: docs/reviews/**
    refs: [".harness/baseline/v5.11.0/**"]
  # Tombstone der Baseline-Migration v5.6.0 -> v5.7.0 (slice-110 / MR-028):
  # dieselbe Klasse — EINGEFRORENE Markdown-LINKS auf den entfernten
  # v5.6.0-Baum in der done/-Doku der welle-78 (der Etappe-C-Slice und die
  # aufgeloeste MR-024; die uebrigen done/-Slices und Reviews nennen den
  # Pfad nur in Inline-Code). Quell-skopiert ausgenommen statt eingefrorene
  # Doku zu editieren; die live-Fundstellen sind auf den jeweils aktuellen Pin
  # retargetet
  # (MR-021).
  - in: docs/plan/planning/done/slice-109-v560-konventions-nachzuege.md
    refs: [".harness/baseline/v5.6.0/**"]
  - in: harness/conventions/done/MR-024-aktuelle-welle-ruhe-marker-form.md
    refs: [".harness/baseline/v5.6.0/**"]
  # Dieselbe Klasse eine Hebung spaeter (v5.7.0 -> v5.9.0): die aufgeloeste
  # MR-027 traegt zwei eingefrorene Links auf den entfernten v5.7.0-Baum; die
  # Review-Reports nennen den Pfad nur in Inline-Code und sind fuer codepaths
  # ohnehin ausgenommen.
  - in: harness/conventions/done/MR-027-struktur-id-verzicht.md
    refs: [".harness/baseline/v5.7.0/**"]

# Linkpflicht für Kennungen (DC-FA-ID-001): nackte IDs im Fließtext
# müssen auf ihre Definition verlinken. Reihenfolge = Präzedenz.
# Dogfooding der Link-Politik (slice-018): link-policy: always macht
# auch Inline-Code-Vorkommen linkpflichtig — „gut verlinkt" als
# gemessenes Property. exempt-paths nimmt literal-schwere Artefakte
# (Changelog, Review-Reports) aus; Beispiel-IDs tragen d-check:ignore.
ids:
  patterns:
    - regex: 'ADR-\d{4}'
      target: docs/plan/adr/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'MR-\d{3}'
      target: harness/conventions/
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: 'DC-(FA-[A-Z]+|QA)-\d+'
      target: spec/lastenheft.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    # Struktur-IDs der Spec-Straten (Baseline-Default seit welle-80, MR-000):
    # Wortgrenzen sind Pflicht: ohne die abschliessende \b meldete eine
    # vierstellige Kennung ihr dreistelliges Praefix als Ziel (dieselbe
    # Bauform wie der Fehl-Target-Befund an ARC-\d{2} im Modul diagrams).
    # Grenze: \b schuetzt nicht vor Bindestrich-Praefixen — GG-SPEC-042
    # matcht und meldet SPEC-042; Beispiel-Kennungen fremder Projekte tragen
    # deshalb den Zeilen-Marker d-check:ignore. Der Link traegt den Abschnitt,
    # der Text die Kennung; Vorkommen in der Zieldatei selbst sind frei.
    - regex: '\bSPEC-\d{3}\b'
      target: spec/spezifikation.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]
    - regex: '\bARC-\d{3}\b'
      target: spec/architecture.md
      link-policy: always
      exempt-paths: [CHANGELOG.md, "docs/reviews/**"]

# Modul diagrams (DC-FA-DIAG-001, seit welle-80): Kennungen IN Diagramm-Fences
# gegen ihre Definitionsquelle. Die Prosa-Module sehen den Fence-Inhalt nicht
# (versions und spans lesen ihn ausdruecklich, aber nicht auf Kennungen) — eine
# Kennung im Diagramm ist fuer sie unsichtbar, und genau dort altert sie stumm,
# wenn eine Komponente umbenannt oder entfernt wird. Geprueft wird Existenz,
# nicht Linkpflicht (in einem Fence gibt es keinen Markdown-Link).
# Definitionsquelle ist die Sicht selbst: §1 vergibt die Kennungen in der
# Komponenten-Tabelle, das Flowchart traegt sie im Kasten-Label.
# Grenzen, gemessen statt hergeleitet: (1) das Modul liest kein Mermaid — es
# findet Token per Regex; ein Diagramm, das eine Komponente ZEIGT, aber keine
# Kennung nennt, faellt nicht auf, und die Richtung "jede definierte Kennung
# kommt im Diagramm vor" ist nicht gedeckt. (2) Definiert heisst "Token kommt
# in der Quelle ausserhalb von Fences vor" — Nennung und Vergabe sind fuer das
# Modul dasselbe: faellt eine Komponente aus der §1-Tabelle, aber bleibt in §2
# stehen, gilt die Kennung weiter als definiert. Der Wachter faengt die
# verwaiste Kennung im Diagramm, nicht die halbe Loeschung in der Sicht.
# (4) Die Musterbreite ist dreistellig: eine vertippte zwei- oder vierstellige
# Kennung im Diagramm ist kein Token und faellt still durch.
diagrams:
  # Scope auf die Spec-Straten: das Muster gilt sonst repo-weit, und ein
  # mermaid-Beispiel mit einer dreistelligen Kennung ausserhalb der Spec ist
  # kein Vertragsbruch, sondern ein Beispiel.
  # Grenze 3: Diagramme ausserhalb von spec/ sind dadurch ungewacht.
  scope:
    roots: [spec]
  patterns:
    - regex: '\bARC-\d{3}\b'
      defined-in: spec/architecture.md

# Referenzmatrix (DC-FA-MTX-001 zwischen Klassen, -002 innerhalb, -003 als Token):
# maschinelle Kodierung von MR-006 — Spec-Straten verweisen nie abwärts auf
# ADRs/Planning (rules), nicht abwärts auf die autoritativere Spec-Schicht
# (order/direction), und ADRs nennen Slices nicht abwärts als Token im Körper
# (token + adr→slice + Provenance-Marker). architecture → spezifikation → lastenheft.
matrix:
  classes:
    # Die Sicht traegt eine eigene Klasse, damit die Token-Pruefung auf SIE
    # skopiert werden kann (AGENTS.md §3.4, Verschaerfung: MR-033). Sie steht
    # VOR spec-straten, weil die Klassen-Zuordnung First-Match ueber diese
    # Reihenfolge ist -- danach deklariert, wuerde sie nie greifen.
    #
    # Der Preis: die Sicht faellt aus der klasseninternen Richtungs-Regel von
    # spec-straten heraus. Ihre Abwaerts-Kante ist darum unten als eigene Regel
    # nachgebaut (spec-straten -> sicht), und die vier Verbote der Straten sind
    # fuer sie wiederholt. Beides ist explizit statt implizit -- eine Kante, die
    # man liest, statt einer, die aus einer Ordnung folgt.
    - name: sicht
      paths: [spec/architecture.md]
    # Modul-Pfade als TOKEN-ZIEL (DC-FA-MTX-003): kein Pfad-Muster, keine
    # Mitglieder -- der Gegenstand ist eine Zeichenkette statt eines
    # Dokuments, dieselbe Bauform wie commit-hash. Gemeldet wird ein Pfad unter den
    # CODE-Wurzeln dieses Repos; Dokument-Pfade sind KEIN Gegenstand, denn die
    # Regel gilt Modul-Pfaden und ein Dokument ist kein Modul. `tools/` fehlt
    # bewusst: ein Gate-Skript ist kein Modul, und die Regel darauf
    # auszudehnen waere eine andere Regel.
    #
    # ENTSCHEIDEND FUER DIE ZUSAGE: matrix liest die ROHEN Zeilen. Ein Pfad in
    # Inline-Code wird damit erfasst -- und genau so schreibt dieses Repo
    # solche Pfade ueberwiegend. Markdown-Link-Spans und Fenced Bloecke zaehlen
    # nicht (DC-FA-MTX-003.a).
    - name: modul-pfad
      token: '\b(internal|cmd)/[a-z]'
    - name: spec-straten
      paths: [spec/lastenheft.md, spec/spezifikation.md]
      # Klasseninterne Verweisrichtung (DC-FA-MTX-002): Rang = autoritativste
      # Schicht zuerst; ein Abwärtsverweis (z. B. lastenheft → architecture,
      # auch transitiv) ⇒ matrix-downward.
      order: [spec/lastenheft.md, spec/spezifikation.md]
      direction: no-downward
    - name: adr
      # BEWUSST OHNE `token`, und das begrenzt die Zusage: gefangen wird ein
      # LINK aus einem Stratum in diese Klasse, nicht ein bares `ADR-<NNNN>` im
      # Fließtext. Die Kennungs-Linkpflicht des Moduls `ids` deckt den Rest —
      # ein Token hier wäre die zweite Antwort auf dieselbe Frage.
      paths: ["docs/plan/adr/[0-9]*.md"]
    - name: slice
      paths: ["docs/plan/planning/**/slice-*.md"]
      # Token-Erkennung (DC-FA-MTX-003): eine Slice-Kennung im ADR-/Spec-Körper
      # ist eine Token-Referenz → matrix-forbidden, außer per Provenance-Marker
      # <!-- d-check:status-provenance --> deklariert (ADRs verweisen abwärts nur
      # als deklarierte Provenance/Verifikations-Zeiger, nie als Entscheidungsgrundlage).
      token: 'slice-\d{3}'
    - name: welle
      paths: ["docs/plan/planning/**/welle-*.md"]
      # Dieselbe Token-Mechanik wie bei slice, eine Ebene hoeher: eine
      # Wellen-Kennung im SPEC-Koerper ist ein Abwaertsverweis auf die zeitliche
      # Schicht (AGENTS.md §3.4). Die Weite `{2,}` statt einer festen Stellenzahl
      # ist Absicht -- eine feste Breite hoerte bei dreistelligen Kennungen auf
      # zu greifen oder, schlimmer, traefe nur deren erste Stellen.
      #
      # Die Kante ADR->Welle ist in der kanonischen Referenz-Matrix ein flaches
      # Verbot -- ohne den Marker-Ausweg, den ADR->Slice offenlaesst. Sie war
      # hier unbewacht, WEIL Welle keine matrix-Klasse war; mit dieser Klasse
      # faellt diese Bedingung weg (MR-006 §Scope-Grenze C-4, MR-034).
      token: 'welle-\d{2,}'
    - name: commit-hash
      # Vierte der fuenf Referenz-Kategorien, die AGENTS.md §3.4 den
      # Spec-Straten verbietet (DC-FA-MTX-003, MR-006). TOKEN-ZIEL: kein
      # Pfad-Muster, keine Mitglieder -- der Gegenstand ist eine Zeichenkette
      # statt eines Dokuments.
      #
      # ZUSAGE, GENAU: gemeldet wird jede 7- bis 40-stellige Zeichenkette aus
      # [0-9a-f] zwischen Wortgrenzen. Das ist WEITER als "Commit-Hash" -- rein
      # dezimale Token dieser Laenge (Lauf-Nummern, Kompaktdaten) und
      # Hex-Farbwerte fallen ebenfalls darunter. Fuer die Straten ist das
      # vertretbar, weil ihre Datums- und Versions-Schreibweisen Trennzeichen
      # tragen und damit auseinanderfallen.
      #
      # GRENZEN, benannt statt wegkonfiguriert:
      #  - Markdown-Link-Spans und Fenced Bloecke zaehlen nicht
      #    (DC-FA-MTX-003.a). Ein Hash im Linktext ODER in der Link-URL bleibt
      #    damit stumm; eine bare URL wird erfasst.
      #  - Grossschreibung faellt heraus (git schreibt klein), Kurzformen unter
      #    sieben Zeichen ebenfalls.
      #  - Der Provenance-Marker auf derselben ROHEN Zeile nimmt auch diese
      #    Klasse aus. §3.4 kennt fuer die Straten keine Provenance-Ausnahme --
      #    die Luecke ist benannt, nicht geschlossen; dieselbe Lage wie bei der
      #    Nachbarklasse (MR-034).
      #  - Die Obergrenze 40 haelt den vollen 64-stelligen sha256-Digest heraus
      #    (keine Wortgrenze in der Mitte). Die Hausschreibweise mit gekuerztem
      #    Digest wird dagegen erfasst.
      token: '\b[0-9a-f]{7,40}\b'
  rules:
    - {from: spec-straten, to: adr, allow: false}
    - {from: spec-straten, to: slice, allow: false}
    - {from: spec-straten, to: welle, allow: false}
    - {from: spec-straten, to: commit-hash, allow: false}
    # Ersatz fuer die entfallene Richtungs-Kante: die Sicht ist die unterste
    # Schicht, ein Verweis aus den Straten auf sie ist abwaerts.
    - {from: spec-straten, to: sicht, allow: false}
    # Die Sicht erbt die vier Verbote der Straten -- sie ist selbst ein Stratum,
    # nur eines mit eigener Klasse.
    - {from: sicht, to: adr, allow: false}
    - {from: sicht, to: slice, allow: false}
    - {from: sicht, to: welle, allow: false}
    - {from: sicht, to: commit-hash, allow: false}
    # Und das eine, das nur fuer sie gilt.
    - {from: sicht, to: modul-pfad, allow: false}
    - {from: adr, to: slice, allow: false}
    - {from: adr, to: welle, allow: false}
  status:
    forbidden: [superseded, deprecated]
  # exakter Heading-Vergleich. Nur die immutable ADR-Geschichte bleibt
  # provenance-exempt; die Spec-Straten-"7. Historie" ist NICHT mehr ausgenommen
  # (v5.0.0/ADR-0047: die Referenz-Richtung gilt auch in der Historie — die
  # §7-Chronik ist entkoppelt und token-frei). Die Lastenheft-Historie trägt seit
  # der Baseline v5.11.0 wieder eine Verweis-Spalte; das nimmt die Prüfung nicht
  # zurück, denn der Kanon lässt dort ausschließlich den externen Change Request
  # zu — ADR- und Slice-Zeiger bleiben in der Historie verboten. Der Baseline-Text
  # führt dafür dieselbe Begründung wie ADR-0047 (eine superseded ADR in einer
  # Protokollzeile ist unreparierbar); geändert hat sich das Mittel, nicht das
  # Ziel.
  exclude-sections: [Geschichte]
  # Grandfathering (DC-FA-MTX-003): die vor Einführung Accepted-ADRs (0001–0021)
  # sind immutabel und nennen Slices als legitime Verifikations-Zeiger im Körper
  # — sie werden ganz übersprungen; neue ADRs ab 0022 tragen den Marker.
  # ADR-0047 kommt dazu, aus demselben Grund wie die Reihe davor und nicht aus
  # Bequemlichkeit: sie ist Accepted und damit immutabel, ihre Wellen-Nennung
  # ist Provenance ("der Pin ist auf <tag> gehoben"), und der Marker-Ausweg
  # steht ihr nicht offen, weil ihr Kern nicht mehr geaendert werden darf.
  # Gemessener Preis der Ausnahme: genau dieses eine Token -- ihr Koerper
  # traegt keinen Slice-Verweis, den die Ausnahme sonst mit stumm schaltete.
  exempt-paths: ["docs/plan/adr/00[01][0-9]-*.md", "docs/plan/adr/002[01]-*.md", "docs/plan/adr/0047-*.md"]

# Pfade in Inline-Code (DC-FA-CODE-001): ./ und ../ immer; dazu die
# Wurzel-Präfixe der eigenen Verzeichniskonvention.
codepaths:
  roots: [docs, spec, tools, harness, internal, cmd]
  # Review-Reports zitieren naturgemäß Datei:Zeile/Pfade — wie bei ids
  # vom Datei-Ventil ausgenommen (DC-FA-CODE-001, slice-043).
  exempt-paths: ["docs/reviews/**"]
  # Tombstone-Register (DC-FA-CODE-001, ADR-0025, slice-054): bewusst
  # entfernte Artefakte, die immutable/historische Doku noch in Inline-Code
  # zitiert — referenz-weit von der Existenz-Prüfung ausgenommen.
  # - adr-immutable-check.sh: abgelöst durch Modul vcs (ADR-0024, slice-053)
  # - completeness-check.sh: abgelöst durch --trace --require-complete (ADR-0026, slice-055)
  # - trace-check.sh: abgelöst durch Modul commits (ADR-0027, slice-056)
  # - planning-consistency.sh: abgelöst durch Modul planning (ADR-0028, slice-057)
  # - arch-check.sh: abgelöst durch das Schwester-Tool a-check (ADR-0029, slice-058)
  # - gate-consistency.sh: Prüfung 3 (DC-QA-03-Modulliste) → Go-Test, Kern via Modul targets (ADR-0032, slice-064)
  # - harness/closure-outcomes.sh: abgelöst durch structure.forbid-pattern im Closure-Profil (ADR-0059)
  ignore-refs: ["tools/adr-immutable-check.sh", "tools/completeness-check.sh", "tools/trace-check.sh", "tools/planning-consistency.sh", "tools/arch-check.sh", "tools/gate-consistency.sh", "tools/harness/closure-outcomes.sh"]

# Versions-Pin-Konsistenz (DC-FA-VER-001, slice-048): jeder ghcr-Image-Pin in
# den Live-Docs muss die aktuelle Version aus version.md#aktuell tragen — sonst
# version-stale (auch in Fenced-Code, gescopte Fence-Ausnahme). exempt-paths
# nimmt historische Pins (done/-Slices, Changelog, Review-Reports) aus; die
# current-from-Datei (version.md) ist selbst ausgenommen.
versions:
  pin-pattern: 'ghcr\.io/[^\s:]+:(v[0-9]+\.[0-9]+\.[0-9]+)'
  current-from: version.md#aktuell
  # historische Pins (DC-FA-VER-001): done/-Slices, Changelog, Lastenheft-
  # Historie, Review-Reports bleiben unberührt.
  exempt-paths: [CHANGELOG.md, "docs/plan/planning/done/**", spec/lastenheft.md, "docs/reviews/**"]

# Modul structure (DC-FA-STRUCT-001): zwei Regel-Arten. Zuerst die
# Chronologie-Monotonie (§Chronologie-Monotonie, ADR-0057): die sechs eigenen
# chronologischen Bestandstabellen; darunter, als siebte Regel, die
# Kennungs-Pflicht des Schema-Abschnitts. Vor dem Scharfschalten gemessen: heutiger Bestand 0;
# retro gegen den Stand vor der welle-73-Heilung meldet das Produkt 27
# Befunde (14 Spezifikation-§7 · 6 Lastenheft-§7 · 7 Roadmap-Drift-Tabelle —
# exakt die Skript-Messung des Register-Eintrags), die drei übrigen Tabellen
# null. Richtung je Regel: das Handbuch ist die einzige aufsteigende Tabelle.
# Inner-Loop-Bindepunkt (doc-check), weil die Zeilen in Feat-/Release-Prep-
# Commits entstehen — dort soll es rot werden, nicht erst an der Closure.
structure:
  - files: spec/lastenheft.md
    section: "## 7. Historie"
    table-order: desc          # Spalte 1 = Version (0.61.0 …)
  - files: spec/spezifikation.md
    section: "## 7. Historie"
    table-order: desc          # Spalte 1 = Datum
  - files: docs/plan/planning/in-progress/roadmap.md
    section: "## Historische Trigger-Verschiebungen"
    table-order: desc          # Drift-Log: neue Zeile oben
  - files: docs/plan/planning/in-progress/roadmap.md
    section: "## Abgeschlossene Wellen"
    table-order: desc
    table-column: 2            # Spalte 1 ist der Wellen-Name, Spalte 2 das Datum
  - files: version.md
    section: "## Verlauf"
    table-order: desc          # Spalte 1 = `vX.Y.Z` in Inline-Code (Roh-Lesung)
  - files: docs/user/benutzerhandbuch.md
    section: "## 11. Änderungshistorie"
    table-order: asc           # die einzige aufsteigende Bestandstabelle (§11: unten anhängen)

  # Struktur-ID-Vergabe im Technik-Stratum (MR-000, seit welle-80): jede
  # ###-Sektion des Schema-Abschnitts traegt eine SPEC-Kennung — sonst zeigt
  # eine ADR auf einen Abschnitt statt auf die Festlegung. Geprueft wird der
  # Ueberschriften-TEXT jeder Sektion des Abschnitts; die Ebene ist der
  # Default (Abschnitts-Ebene + 1).
  # Grenze 1: Tabellen-Kennungen deckt die Bedingung nicht — sie sieht nur
  # Ueberschriften. Gebunden ist nur §4 (ein
  # Go-Test haelt Spalte 1 gegen AllReasons()); §3 und §6 tragen ihre
  # Kennung ungebunden, ebenso die Eindeutigkeit innerhalb von §2.
  # Grenze 2: die Schluessel-Tabelle INNERHALB von SPEC-005 bleibt
  # kennungslos — ihre Zeilen sind ueber den Konfigurations-Schluessel
  # adressierbar, den sie definieren (fachlicher Schluessel statt Struktur-ID).
  - files: spec/spezifikation.md
    section: "## 2. Datenstrukturen und Schemas"
    headings-match: '^SPEC-[0-9]{3} '

  # Der Werkzeug-Einstieg muss AGENTS.md IMPORTIEREN, nicht nur nennen (MR-043).
  # Die Import-Zeile ist kein Markdown-Link und damit für links/anchors
  # unsichtbar — fiele sie weg, liefe jeder Folgelauf ohne die Hard Rules im
  # Kontext an, und kein Gate sagte etwas. Die Existenz des Ziels deckt der
  # Prosa-Link darunter (Modul links); diese Regel deckt den Import selbst.
  - files: CLAUDE.md
    section-pattern: '^# '
    sections: one
    require-pattern: '(?m)^@AGENTS\.md$'

# Modul vcs (DC-FA-VCS-001, slice-053): git-Diff-Immutabilität der eigenen
# Accepted-ADRs über die Commit-Range — `make adr-check` aktiviert es mit
# `--enable vcs` (NICHT in der modules-Liste oben, daher im Default-doc-check
# inert/byte-identisch). Core in Parität zum abgelösten `adr-immutable-check.sh`
# (nur Kopf-Status-Zeile gestrippt, Geschichte ausgenommen); löst dessen Mechanik
# ab (ADR-0024, Teil-Supersede von ADR-0016).
vcs:
  paths: ["docs/plan/adr/[0-9]*.md"]
  immutable-when: '^\*\*Status:\*\* Accepted'
  exclude-sections: [Geschichte]
  status-line: '^\*\*Status:\*\*'
  head-allow: '^\*\*Status:\*\* (Accepted|Superseded by ADR-[0-9]{4})'

# Modul commits (DC-FA-COMMITS-001, slice-056): Traceability-Kennung in
# Commit-Messages über eine Range — `make trace-check` aktiviert es mit
# `--enable commits` (NICHT in der modules-Liste oben, daher im Default-doc-check
# inert/byte-identisch). id-patterns = die drei Anforderungs-/Entscheid-Muster
# der ids-Liste (ADR/MR/DC) plus slice-NNN (eine ID-Definition neben
# ids.patterns, statt im Skript-ID_RE); die Struktur-IDs SPEC/ARC stehen hier
# bewusst NICHT — sie beantworten keine Traceability-Frage (MR-000);
# exempt-pattern nimmt Merge-/Revert-Betreffe aus. Löst tools/trace-check.sh ab
# (ADR-0027, Supersedes die Skript-Mechanik von ADR-0013).
commits:
  id-patterns:
    - 'ADR-\d{4}'
    - 'MR-\d{3}'
    - 'DC-(FA-[A-Z]+|QA)-\d+'
    - 'slice-\d+'
  exempt-pattern: '^(Merge |Revert )'

# Modul planning (DC-FA-PLAN-001, slice-057): Roadmap-↔-in-progress-Lifecycle-
# Konsistenz — `make planning-check` aktiviert es mit `--enable planning` (NICHT in
# der modules-Liste oben, daher im Default-doc-check inert). Hermetisch (nur die
# Roadmap-Datei + Verzeichnis-Listing, kein git, kein Netz); slice-glob per Default; heading/marker unten explizit (Offene-Wellen-Form) (`## Aktuelle Welle` / „Keine aktive Welle" / `slice-*.md`). Löst
# tools/planning-consistency.sh ab (ADR-0028, letztes Familien-Skript des tools/*.sh-Audits).
planning:
  roadmap: docs/plan/planning/in-progress/roadmap.md
  # Offene-Wellen-Form (Baseline v5.12.0): die Sektion traegt
  # zwei unabhaengige Aussagen — die Liste folgt den Dateien (je offener
  # Welle ein Zeiger), der Ruhe-Marker "Nichts in Arbeit" folgt dem
  # Anspruch (leeres in-progress/) und steht ZUSAETZLICH zur Liste. Die
  # Marker-Haelfte waechtert planning-drift beidseitig; die Listen-Haelfte
  # misst wave-drift unter mode: many als Kennungs-Bijektion (Zeiger <=>
  # flache Wellendokumente, DC-FA-PLAN-001 0.62.0). Das Eroeffnungs-
  # Fenster "Welle offen, in-progress leer" und der Mehr-Wellen-Betrieb
  # sind damit legitime Zustaende — die frueher hier benannte Grenze ist
  # aufgeloest. Neue Grenze: die Sektions-PROSA darf keine Wellen-Kennung
  # nennen (jede zaehlte als Zeiger), so wie sie den Marker-Wortlaut nie
  # woertlich tragen durfte.
  heading: "## Offene Wellen"
  marker: "Nichts in Arbeit"
  # Dritte Faehigkeit (DC-FA-PLAN-001 §Wellen-Invariante, ADR-0055): dieselbe
  # Lifecycle-Invariante eine Ebene hoeher. Vor dem Scharfschalten am eigenen
  # Bestand gemessen -- 0 Befunde; im Schwester-Repo elf fehlende
  # Ergebnisnotizen (robust; ein zwoelfter Probe-Befund war ein Artefakt des
  # Default-Markers). Die Gegenrichtung (Notiz ohne Registerzeile) ist
  # hier im August dreimal eingetreten und wurde von Hand gefunden.
  # Alle uebrigen Schluessel stehen auf den Konventions-Defaults.
  waves:
    dir: docs/plan/planning
    # Kennungs-Bijektion statt Singleton (DC-FA-PLAN-001 0.62.0): dieses
    # Repo faehrt das Offene-Wellen-Modell. Erst nach Release und
    # Digest-Backfill gesetzt — ein aelterer Pruefer braeche am
    # unbekannten Schluessel mit Exit 2.
    mode: many

# Modul targets (DC-FA-TGT-001, slice-063): Deklarations-Konsistenz Doku ↔
# Build-Targets — `make gate-consistency` aktiviert es mit `--enable targets`
# (NICHT in der modules-Liste oben, daher im Default-doc-check inert). Hermetisch
# (Filesystem-Port, kein git/Netz/Makefile-Ausführen): ein in einer Doku-Tabellen-
# zeile behauptetes `make X` ohne Makefile-Regel ⇒ gate-phantom; jede Makefile-
# Regel ohne Eintrag in der Autoritäts-Doku (AGENTS.md §4) ⇒ gate-undocumented.
# exempt-targets bleibt leer — d-check dokumentiert alle Targets in AGENTS.md §4
# (die erschöpfende Prüfung des abgelösten gate-consistency.sh-Kerns). Löst den
# Doku-↔-Makefile-Kern von tools/gate-consistency.sh ab (ADR-0031).
targets:
  makefiles: [Makefile]
  doc-tables: [AGENTS.md, harness/README.md]
  authority: AGENTS.md
  exempt-targets: []

# --trace ist ein Flag-Modus (DC-FA-CLI-009), KEIN --enable-Modul — steht daher
# NICHT in der modules-Liste oben. d-check dogfoodet ihn über `make trace` (advisory
# RTM) und `make completeness-check`/`doc-complete` (--require-complete, DC-FA-CLI-011,
# in fullbuild). Der Block setzt die vier RTM-Konventionen auf EXAKT ihre Defaults
# (spezifikation.md §2) — die RTM bleibt byte-identisch (DC-QA-02). Einziger Verhaltens-
# Effekt: `requirements.source` ist NICHTLEER explizit gesetzt und armiert damit den
# fail-closed Nullmengen-Guard (DC-FA-REQ-001, ADR-0037, slice-070): verlöre
# spec/lastenheft.md je die Heading-Konvention (0 erkannte Anforderungen), bräche
# `make trace`/`completeness-check` mit Exit 2 statt still-grün mit leerer RTM. Heute
# nachweislich safe (42 Anforderungen, 0 Waisen).
trace:
  requirements:
    # explizit nichtleer = Guard scharf (leer/abwesend ⇒ Default ohne Guard)
    source: spec/lastenheft.md
    # Default-Regex: Anforderungs-Kennung als Ganz-Token im Heading
    id-pattern: '[A-Z][A-Z0-9]*-(?:FA-[A-Z]+|QA)-\d+[A-Za-z]?'
  adrs:
    dir: docs/plan/adr
    file-pattern: '^(\d{4})-.*\.md$'      # Capture-Gruppe 1 = NNNN
    id-prefix: 'ADR-'                      # ⇒ ADR-NNNN
  slices:
    dir: docs/plan/planning
    file-pattern: '^(slice-\d+)-.*\.md$'   # Capture-Gruppe 1 = volle Kennung slice-NNN
    id-prefix: ''                          # leer: der Dateiname trägt die volle Kennung
