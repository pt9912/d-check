# d-check prüft sich selbst (Dogfooding, slice-004 / MR-007;
# Selbstkonfiguration ids+matrix: slice-007, codepaths: slice-013,
# spans: slice-015, hostpaths: slice-016).
# "." = gesamte Repo-Wurzel; SKIP_DIRS (.git, vendor, …) gelten immer.
# ignore: die lokale Lese-Form der adoptierten Baseline trägt Fremdinhalt — die
# Kurs-Docs referenzieren ihre eigenen IDs/Pfade, die hier nicht existieren.
# Selbe Klasse wie die eingebauten SKIP_DIRS (Fremd-/Generiertes); kein eigener
# Doku-Vertrag, also aus dem Dogfooding-Scan ausgenommen statt geprüft. Zwei
# Pfade, weil Regelwerk und Templates unterschiedlich verkörpert werden:
#   .harness/baseline/<tag>/  — committetes, vendortes Regelwerk (MR-019)
#   .harness/cache/<tag>/     — gitignorierter, ephemerer Cache (Templates-
#                               Staging, MR-017/MR-018)
scan:
  roots: ["."]
  ignore: [".harness/baseline/**", ".harness/cache/**"]
# citations ist das EINZIGE fail-closed Modul dieser Liste: eine strukturell
# unbrauchbare Direktive beendet den ganzen Lauf mit Exit 2, auch im
# pre-commit-Hook. Tragbar, seit die Direktive nur ausserhalb von Inline-Code
# zaehlt (ADR-0060) — die Syntax-Doku ist damit keine Fundstelle mehr.
# EINE planmaessige Rot-Quelle ist der Baseline-Bump: er verschiebt die
# Zeilenspannen, und MR-051 legt das Neu-Ankern in die Bump-Prozedur. Eine
# Direktive auf ein repo-internes Ziel meldet dagegen bei JEDER Aenderung des
# Ziels — auch dafuer gilt: neu ankern, nicht loeschen (MR-051).
# Grenze: d-check:ignore greift hier NICHT — das Modul kennt keine feine
# Ventil-Achse; grob wirken nur scan.ignore und citations.scope.
#
# Diese Liste hat Spiegel ausserhalb dieser Datei (BEO-ALL/modulliste-spiegel-ungegated): FOCUS_DISABLE im
# Makefile und netlessDocModules() im Go-Test. Beide sind hier nachzuziehen.
modules: [links, anchors, ids, matrix, codepaths, spans, hostpaths, versions, structure, diagrams, citations]

# Geteiltes Referenz-Ventil (DC-FA-REF-001): Ziel-Achsen-Pendant zu scan.ignore
# (jenes entfernt Quell-Dateien, dieses Ziel-Referenzen), honoriert von
# links/anchors/codepaths. Tombstone der Baseline-Migration v1.4.0 -> v5.0.0
# (slice-084 / MR-023): drei EINGEFRORENE Verweise (immutable ADR-0022 + done/-
# Slices 080/081) zitieren den entfernten .harness/baseline/v1.4.0/-Pfad als
# Historie — quell-skopiert (in) von der Existenzpruefung ausgenommen, ohne die
# eingefrorene Doku zu editieren. Die live-Fundstellen sind auf v5.0.0 retargetet.
# Ortsfeste Verweise (DC-FA-LINK-001 §Ortsfeste Verweise, ADR-0056): eine
# Datei in einem wandernden Lifecycle-Verzeichnis muss jedes relative Ziel von
# JEDEM Ort der Gruppe aufloesen -- und ueberall auf dasselbe. Vor dem
# Scharfschalten gemessen: heutiger Bestand 0; retro gegen den Stand vor der
# welle-69-Eroeffnung meldet das Produkt 19 Befunde (15 davon Teil des realen
# Bruchs; dessen uebrige vier waren Ziel-Wanderungen -- benannte Grenze). Der
# Ruheort ist fixed (seine Dateien wandern nie wieder -- sonst 108
# Falsch-Positive).
links:
  resolve-from:
    - dirs:
        - docs/plan/planning/open
        - docs/plan/planning/next
        - docs/plan/planning/in-progress
      fixed-dirs:
        - docs/plan/planning/done

